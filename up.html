<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>완료 사진 올리기 · 데코브라이트</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="icon" href="icons/icon.svg">
<style>
:root{--ink:#221C18;--muted:#7A6E66;--line:#E6D9C6;--bd:#CDBBA3;--pri:#3B2F2A;--paper:#FBF6EE;--warm:#E0952B;--warm-s:#FCEBD2;--ok:#2E6A4E;--no:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:17px;line-height:1.55}
.w{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.hd{background:#1d1714;color:#fbf2e4;border-radius:14px;padding:16px;margin-bottom:12px}
.hd h1{margin:0 0 6px;font-size:23px}
.hd p{margin:2px 0;font-size:16px;color:#e9dccb}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.f{display:block;font-weight:700;margin-bottom:10px}
label.f input{display:block;width:100%;margin-top:4px;font:inherit;font-size:18px;height:52px;border:1px solid var(--bd);border-radius:10px;padding:0 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.seg button{flex:1 1 30%;font:inherit;font-size:17px;font-weight:700;height:50px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:64px;font:inherit;font-size:21px;font-weight:800;border-radius:14px;border:0;cursor:pointer;margin-bottom:10px}
.big.a{background:var(--warm);color:#1d1714}
.big.b{background:#fff;border:2px solid var(--pri);color:var(--pri)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.msg{min-height:26px;font-weight:700;margin:4px 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--no)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.err{background:#fff;border:2px solid var(--no);border-radius:14px;padding:16px;font-size:18px}
</style>
</head>
<body>
<div class="w">
  <div class="hd"><h1>📸 완료 사진 올리기</h1><p id="hInfo">불러오는 중…</p></div>
  <div id="main" hidden>
    <div class="card">
      <label class="f">내 이름 <small style="font-weight:400;color:var(--muted)">(한 번 적으면 기억합니다)</small><input id="nm" maxlength="20" placeholder="예: 김기사" autocomplete="name"></label>
      <b>어떤 사진인가요?</b>
      <div class="seg" id="stg"><button type="button" data-s="시공 후" aria-pressed="true">✅ 완료</button><button type="button" data-s="시공 중" aria-pressed="false">🔨 작업 중</button><button type="button" data-s="하자·보수" aria-pressed="false">⚠ 문제·하자</button></div>
      <label class="f">한 줄 메모 <small style="font-weight:400;color:var(--muted)">(선택)</small><input id="memo" maxlength="60" placeholder="예: 거실 우물 마감 완료"></label>
      <label class="big a" for="cam">📸 사진 찍기</label><input id="cam" type="file" accept="image/*" capture="environment">
      <label class="big b" for="fs">🖼 찍어 둔 사진 여러 장 고르기</label><input id="fs" type="file" accept="image/*" multiple>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <div class="card" id="doneBox" hidden><b id="doneT"></b><div class="gal" id="gal" style="margin-top:8px"></div></div>
    <p style="font-size:14px;color:var(--muted)">올린 사진은 사장님 앱의 「현장 사진 보관함」에 이 현장 사진으로 들어갑니다. 큰 사진은 저절로 줄여서 올립니다.</p>
  </div>
  <div class="err" id="bad" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, P = new URLSearchParams(location.search), oid = P.get('o') || '', tr = P.get('t') || '', key = P.get('k') || '';
  var C = null, ord = null, stage = '시공 후', n = 0;
  function bad(t) { $('main').hidden = true; $('bad').hidden = false; $('bad').textContent = t; $('hInfo').textContent = '데코브라이트'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  try { $('nm').value = localStorage.getItem('deco-up-name') || ''; } catch (e) {}
  if (!window.supabase || !oid || !key) return bad(!window.supabase ? '인터넷 연결을 확인하고 다시 열어 주세요.' : '주소가 잘못되었습니다. 사장님께 받은 카톡의 주소를 다시 눌러 주세요.');
  C = window.supabase.createClient('https://dypvqgaayumrhaiphatu.supabase.co', 'sb_publishable_5-LUZwZQ3VwBxDKDA_nJpw_ddF6QKdE', { auth: { persistSession: false } });
  C.from('records').select('data').eq('coll', 'orders').eq('id', oid).maybeSingle().then(function (r) {
    var d = r.data && r.data.data;
    if (r.error) return bad('서버에 연결하지 못했습니다. 잠시 뒤 다시 열어 주세요.');
    if (!d || d._del) return bad('이 작업 지시서를 찾을 수 없습니다. 사장님 앱에서 저장된 뒤 1~2분 지나 다시 열어 주세요.');
    if (!d.upk || d.upk !== key) return bad('사진 올리기 주소가 바뀌었거나 맞지 않습니다. 사장님께 새 주소를 받아 주세요.');
    ord = d; var dt = d.workDate ? new Date(d.workDate + 'T00:00') : null;
    $('hInfo').innerHTML = '📍 ' + esc(d.addr || d.name || '현장') + '<br>📅 ' + (dt ? (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 (' + '일월화수목금토'[dt.getDay()] + ')' : '') + (tr ? ' · 🛠 ' + esc(tr) : '');
    $('main').hidden = false;
  }, function () { bad('서버에 연결하지 못했습니다. 인터넷을 확인해 주세요.'); });
  $('stg').addEventListener('click', function (e) { var b = e.target.closest('[data-s]'); if (!b) return; stage = b.dataset.s; [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); }); });
  function shrink(f) { return new Promise(function (ok, no) { var u = URL.createObjectURL(f), im = new Image();
    im.onload = function () { var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(function (b) { b ? ok({ blob: b, w: c.width, h: c.height }) : no(new Error('변환 실패')); }, 'image/jpeg', 0.85); };
    im.onerror = function () { URL.revokeObjectURL(u); no(new Error('사진을 열 수 없습니다')); }; im.src = u; }); }
  function up(fl) { fl = [].slice.call(fl || []).filter(function (f) { return /^image\//.test(f.type); }); if (!fl.length || !ord) return;
    var nm = $('nm').value.trim(), m = $('msg'); try { localStorage.setItem('deco-up-name', nm); } catch (e) {}
    var memo = [tr ? '[' + tr + ']' : '', nm, $('memo').value.trim() || (stage === '시공 후' ? '완료 사진' : '')].filter(Boolean).join(' '), done = 0;
    m.className = 'msg'; m.textContent = '올리는 중… 0 / ' + fl.length + '  (화면을 닫지 마세요)';
    fl.reduce(function (p, f) { return p.then(function () { return shrink(f).then(function (r) {
      var now = Date.now(), id = 'p' + now.toString(36) + Math.random().toString(36).slice(2, 6), path = 'p/' + id + '.jpg';
      var meta = { id: id, job: ord.quoteId || '', stage: stage, memo: memo, w: r.w, h: r.h, taken: f.lastModified || now, added: now, by: nm || '작업자', order: oid, path: path };
      return C.storage.from('photos').upload(path, r.blob, { upsert: true, contentType: 'image/jpeg' }).then(function (x) { if (x.error) throw x.error;
        return C.from('records').upsert({ coll: 'photos', id: id, data: meta }, { onConflict: 'coll,id' }); }).then(function (x) { if (x.error) throw x.error;
        done++; n++; m.textContent = '올리는 중… ' + done + ' / ' + fl.length + '  (화면을 닫지 마세요)';
        var im = document.createElement('img'); im.src = URL.createObjectURL(r.blob); im.alt = ''; $('gal').insertBefore(im, $('gal').firstChild); $('doneBox').hidden = false; $('doneT').textContent = '✔ 지금까지 올린 사진 ' + n + '장'; }); }); }); }, Promise.resolve())
      .then(function () { m.className = 'msg ok'; m.textContent = '✔ ' + done + '장을 올렸습니다. 감사합니다! 더 올릴 사진이 있으면 계속 누르세요.'; },
        function (e) { m.className = 'msg bad'; m.textContent = '올리지 못했습니다 (' + done + '장까지 올라감). 인터넷을 확인하고 다시 눌러 주세요.'; }); }
  $('cam').onchange = function () { up(this.files); this.value = ''; };
  $('fs').onchange = function () { up(this.files); this.value = ''; };
})();
</script>
</body>
</html>
