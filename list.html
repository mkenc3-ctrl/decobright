<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>견적 목록 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bar input{flex:1 1 240px;font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;height:46px}
.stp{display:flex;gap:3px;margin:6px 0 4px;max-width:420px}.stp span{flex:1;text-align:center;font-size:12px;padding:3px 0;background:#efe6d8;color:#8a7d6c;border-radius:4px}.stp span.done{background:#e8c48c;color:#5a4320}.stp span.now{background:#E0952B;color:#fff;font-weight:700}.stp.hold{font-size:13px;color:#8a7d6c}
.q{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;background:#fff;border:1px solid var(--line);padding:12px;margin-bottom:8px}
@media (max-width:560px){.q{grid-template-columns:minmax(0,1fr)}}
.q img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#1b2233;display:block}
.q .noimg{width:100%;aspect-ratio:16/10;background:var(--line2)}
.q h3{margin:0;font-size:19px}
.q .meta{color:var(--muted);font-size:14px}
.q .sum{font-size:20px;font-weight:700;margin:4px 0}
.q .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.q .acts .btn2{height:40px;font-size:15px;padding:0 12px}
.st,.st2{font:inherit;font-size:15px;height:40px;border:1px solid var(--pri);border-radius:10px;background:var(--pri-s);padding:0 8px}
.st2{height:46px;font-size:16px}
.next{margin:8px 0;padding:10px 12px;border:1px solid #e3b26b;background:#fff7ea;border-radius:10px;font-size:15px}
.next div{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body class="app">
<div class="page">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">견적 목록</h1>
  <p class="sub">저장한 견적입니다(같이 쓰는 기기에도 보입니다). 눌러서 고치거나 견적서를 다시 인쇄할 수 있습니다.</p>
  <div class="bar">
    <input id="qs" type="search" placeholder="고객명·주소·견적번호로 찾기" aria-label="견적 찾기">
    <select id="fst" class="st2" aria-label="상태로 거르기"></select>
    <a class="btn2 pri" href="quote.html">+ 새 견적</a>
  </div>
  <div id="box"></div>
</div>
<script src="common.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  var box = document.getElementById('box'), qs = document.getElementById('qs'), E = DECO.esc;
  var OK = {}; (DECO.okq ? DECO.okq() : []).forEach(function (a) { OK[a.qid] = a; });
  try { localStorage.setItem('deco-okseen', String(Date.now())); } catch (e) {}
  function okTag(id) { var a = OK[id]; if (!a) return ''; var d = new Date(a.at || 0);
    return '<div style="margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:700;font-size:15px;background:' + (a.act === 'ok' ? '#E8F3EC;color:#2E6A4E' : '#FCEBD2;color:#8a4a12') + '">' + (a.act === 'ok' ? '✅ 손님이 「이 견적으로 진행」' : '🤔 손님이 「상담이 더 필요」') + ' · ' + (d.getMonth() + 1) + '/' + d.getDate() +
      (a.md ? '<br><span style="font-weight:800">📅 실측 희망: ' + E(a.md) + '</span>' : '') + (a.drop ? '<br><span style="font-weight:500">✂ 빼고 싶은 항목: ' + E(a.drop.join(', ')) + (a.want ? ' → 예상 ' + DECO.won(a.want) : '') + '</span>' : '') + (a.tm ? '<br><span style="font-weight:500">편한 시간: ' + E(a.tm) + '</span>' : '') + (a.say ? '<br><span style="font-weight:500">남긴 말: ' + E(a.say) + '</span>' : '') + '</div>'; }
  var SEEN = DECO.seen ? DECO.seen() : {};
  function seenTag(q) { var s = SEEN[q.id]; if (!s) return q.vk && /^(상담|실측)$/.test(q.status || '상담') ? '<div class="meta" style="color:#7A6E66">👀 손님이 아직 온라인 견적서를 안 열어 봤습니다</div>' : '';
    var d = new Date(s.last || 0); return '<div class="meta" style="color:#2E6A4E;font-weight:700">👀 손님이 견적서를 ' + (s.n || 1) + '번 열어 봤습니다 · 마지막 ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '</div>'; }
  // 다시 연락 카톡 (상담·실측 단계 견적)
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-follow]'); if (!b) return; var q = DECO.getQuote(b.dataset.follow); if (!q) return;
    var c = q.cust || {}, s = DECO.settings(), vd = +s.validDays || 30, end = new Date((q.created || q.updated) + vd * 864e5), sn = SEEN[q.id], vl = DECO.viewLink(q);
    DECO.kakao(DECO.kfmt({ icon: '💡', title: '견적 다시 안내', info: [['👤', '고객', c.name ? c.name + ' 님' : ''], ['🔖', '견적번호', q.no], ['💰', '견적 금액', DECO.won(q.totals && q.totals.total) + ' (부가세 포함)'], ['⏳', '견적 유효', DECO.date(end) + ' 까지']],
      secs: [['혹시 이런 점이 궁금하셨나요?', ['실측은 무료이고, 오셔서 보시고 결정하셔도 됩니다', '빼고 싶은 항목이 있으면 맞춰서 다시 견적 드립니다', '시공은 보통 하루, 길어도 이틀이면 끝납니다']]],
      foot: [(c.name ? c.name + ' 님, ' : '') + '지난번 보내드린 견적 한 번 더 안내드립니다. ' + (sn ? '' : '') + '편하신 때 연락 주시면 자세히 설명드리겠습니다. 🙏', vl ? '📄 견적서 다시 보기 · 진행 알려 주기\n' + vl : ''] }), '다시 연락 카톡'); });
  function draw() {
    var k = qs.value.trim(), L = DECO.list().filter(function (q) {
      if (fs.value && (q.status || '상담') !== fs.value) return false;
      if (!k) return true; var c = q.cust || {}; return [c.name, c.addr, c.phone, q.no].join(' ').indexOf(k) >= 0; });
    if (!L.length) { box.innerHTML = '<div class="empty">' + (k || fs.value ? '찾는 견적이 없습니다.' : '아직 저장한 견적이 없습니다.<br>「+ 새 견적」을 눌러 시작하세요.') + '</div>'; return; }
    box.innerHTML = L.map(function (q) {
      var c = q.cust || {}, id = encodeURIComponent(q.id);
      return '<div class="q">' + (q.img ? '<img src="' + q.img + '" alt="시공 후 예상 모습">' : '<div class="noimg"></div>') +
        '<div><h3>' + E(c.name || '이름 없음') + ' 님</h3>' +
        '<div class="meta">' + E(q.no) + ' · ' + DECO.date(q.updated) + (c.addr ? ' · ' + E(c.addr) : '') + (c.phone ? ' · ' + E(c.phone) : '') + (function () { var st = q.status || '상담'; if (st !== '상담' && st !== '실측') return ''; var vd = +DECO.settings().validDays || 30, end = (q.created || q.updated) + vd * 864e5, left = Math.ceil((end - Date.now()) / 864e5); return left < 0 ? ' · <b style="color:#b5462f">유효기간 지남 (' + DECO.date(end) + ')</b>' : left <= 5 ? ' · <b style="color:#a86a12">유효기간 ' + left + '일 남음</b>' : ''; })() + '</div>' +
        '<div class="meta">' + E(q.pkg === 'none' ? '패키지 없음' : q.pkgName) + (q.items && q.items.length ? ' + 추가 ' + q.items.length + '건' : '') + '</div>' +
        (function () { var S = ['상담', '실측', '계약', '시공', '완료'], k = S.indexOf(q.status || '상담'); if (k < 0) return '<div class="stp hold">보류 중</div>';
          return '<div class="stp" aria-label="진행 단계 ' + (k + 1) + '/5">' + S.map(function (x, j) { return '<span class="' + (j < k ? 'done' : j === k ? 'now' : '') + '">' + x + '</span>'; }).join('') + '</div>'; })() +
        '<div class="sum">' + DECO.won(q.totals && q.totals.total) + ' <small style="font-size:13px;font-weight:400;color:var(--muted)">부가세 포함</small></div>' +
        seenTag(q) + okTag(q.id) + (/^(상담|실측)$/.test(q.status || '상담') ? '<div class="acts" style="margin-top:6px"><button type="button" class="btn2" data-follow="' + E(q.id) + '" style="background:#FEE500;border-color:#FEE500;color:#191919;font-weight:800">💬 다시 연락 카톡</button></div>' : '') + (q.vk ? '<div class="acts" style="margin-top:6px"><a class="btn2" target="_blank" rel="noopener" href="' + E(DECO.viewLink(q)) + '&me=1">📄 손님이 보는 견적서 보기</a></div>' : '') + '<div class="acts"><select class="st" data-st="' + E(q.id) + '" aria-label="진행 상태">' + DECO.STATUS.map(function (s) { return '<option' + ((q.status || '상담') === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
        '<a class="btn2" href="quote.html?id=' + id + '">열어서 고치기</a><a class="btn2" href="print.html?id=' + id + '">견적서 인쇄</a>' +
        '<a class="btn2" href="contract.html?id=' + id + '">계약 안내 문자</a><a class="btn2" href="measure.html?id=' + id + '">실측 기록' + (q.measure ? ' ✔' : '') + '</a><a class="btn2" href="sign.html?id=' + id + '">계약서·서명' + (q.sign && q.sign.cust ? ' ✔' : '') + '</a><a class="btn2" href="order.html?quote=' + id + '">작업 지시서</a><a class="btn2" href="photos.html?job=' + id + '">현장 사진</a>' +
        '<button class="btn2" type="button" data-copy="' + E(q.id) + '">복사해서 새 견적</button>' +
        '<button class="btn2 no" type="button" data-del="' + E(q.id) + '">지우기</button></div></div></div>';
    }).join('');
  }
  box.addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) { var src = DECO.getQuote(cp.dataset.copy), c2 = JSON.parse(JSON.stringify(src)); c2.id = null; c2.status = '상담';
      var nq = DECO.saveQuote(c2); if (nq) location.href = 'quote.html?id=' + encodeURIComponent(nq.id); return; }
    var b = e.target.closest('[data-del]'); if (!b) return; var q = DECO.getQuote(b.dataset.del);
    if (q && confirm((q.cust && q.cust.name || '이 견적') + ' 견적(' + q.no + ')을 지울까요?\n지운 견적은 되살릴 수 없습니다.')) { DECO.delQuote(q.id); draw(); }
  });
  box.addEventListener('change', function (e) { var s = e.target.closest('[data-st]'); if (!s) return; DECO.setQuoteStatus(s.dataset.st, s.value);
    var old = document.getElementById('nextStep'); if (old) old.remove(); if (s.value !== '계약') return;
    var id = encodeURIComponent(s.dataset.st), d = document.createElement('div'); d.id = 'nextStep'; d.className = 'next';
    d.innerHTML = '<b>계약으로 바꿨습니다. 다음 할 일:</b><div><a class="btn2 pri" href="stats.html#pay">① 계약금 입금 기록</a><a class="btn2" href="contract.html?id=' + id + '">② 계약 안내 문자</a><a class="btn2" href="sign.html?id=' + id + '">계약서·고객 서명</a><a class="btn2" href="order.html?quote=' + id + '">③ 시공 날짜·작업 지시서</a></div>';
    s.parentNode.insertAdjacentElement('afterend', d); });
  var fs = document.getElementById('fst');
  fs.innerHTML = '<option value="">전체 상태</option>' + DECO.STATUS.map(function (s) { return '<option>' + s + '</option>'; }).join('');
  fs.addEventListener('change', draw);
  qs.addEventListener('input', draw); draw();
})();
</script>
</body>
</html>
