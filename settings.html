<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회사 정보 설정 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
</head>
<body class="app">
<div class="page" style="max-width:760px">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">회사 정보 설정</h1>
  <p class="sub">① 칸을 채우고 ② 「저장」을 누르면 ③ 견적서 공급자 칸에 그대로 찍힙니다. (이 기기에만 저장)</p>
  <form class="card" id="f">
    <div class="grid2">
      <label class="fl"><span class="need">상호</span><input name="company" required placeholder="예: 데코브라이트"></label>
      <label class="fl">사업자등록증 상호<input name="bizName" placeholder="예: 데코브라이트 간접조명 실링팬"><small>견적서 공급자 칸에 찍힙니다. 위 상호는 문자·글에 씁니다.</small></label>
      <label class="fl">대표자<input name="ceo" placeholder="예: 홍길동"></label>
      <label class="fl">사업자등록번호<input name="bizno" placeholder="예: 000-00-00000" inputmode="numeric"></label>
      <label class="fl"><span class="need">대표 전화</span><input name="phone" required placeholder="예: 010-0000-0000" inputmode="tel"></label>
      <label class="fl">업태<input name="bizType"></label>
      <label class="fl">종목<input name="bizItem"></label>
      <label class="fl" style="grid-column:1/-1">사업장 주소<input name="addr" placeholder="예: 경남 창원시 …"></label>
      <label class="fl">전자우편<input name="email" type="email" placeholder="예: deco@example.com"></label>
      <label class="fl">기본 담당자<input name="staff" placeholder="견적 화면 담당자 칸에 미리 넣음"></label>
      <label class="fl" style="grid-column:1/-1">입금 계좌<input name="bank" placeholder="예: ○○은행 000-0000-0000 (예금주 데코브라이트)"><small>견적서 아래쪽에 표시됩니다. 비워 두면 표시하지 않습니다.</small></label>
      <label class="fl">이달 매출 목표(만 원)<input name="goal" type="number" min="0" placeholder="예: 3000"><small>처음 화면에 목표까지 얼마 남았는지 막대로 보입니다. 비우면 안 보임.</small></label>
      <label class="fl">견적 유효기간(일)<input name="validDays" type="number" min="1" max="365"></label>
      <label class="fl">주 활동 지역<input name="area" placeholder="예: 창원"><small>홍보 글 제목·해시태그에 들어갑니다.</small></label>
      <label class="fl">블로그 주소<input name="blog" placeholder="예: blog.naver.com/○○○"></label>
      <label class="fl" style="grid-column:1/-1">기본 해시태그<textarea name="tags" rows="2"></textarea><small>인스타그램 글 끝에 붙습니다.</small></label>
      <label class="fl" style="grid-column:1/-1">견적서 안내 문구<textarea name="terms" rows="3"></textarea></label>
      <div style="grid-column:1/-1;border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-weight:700;font-size:18px">계약 안내 문자</div>
      <label class="fl" style="grid-column:1/-1">첫 인사 소개말<input name="slogan" placeholder="예: 간접 조명 · 실링팬 전문 브랜드"><small>「○○ ○○입니다.」로 시작합니다.</small></label>
      <label class="fl">기본 계약금(원)<input name="deposit" type="number" min="0" step="10000"></label>
      <label class="fl">부가세<select name="vat" style="font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;background:#fff"><option value="separate">별도 (요청 시 발행)</option><option value="include">포함</option></select></label>
      <div class="fl" style="grid-column:1/-1"><b>회사 도장 (견적서 대표자 옆)</b><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px"><img id="stImg" alt="도장 미리 보기" style="height:70px;border:1px dashed var(--bd);border-radius:8px;background:#fff;padding:4px" hidden><label class="btn2" style="cursor:pointer">📷 도장 사진 올리기<input type="file" id="stF" accept="image/*" hidden></label><button class="btn2 no" type="button" id="stX" hidden>도장 빼기</button></div><input type="hidden" name="stamp"><small>흰 종이에 찍은 도장을 가까이서 찍어 올리면 흰 바탕을 빼고 넣습니다. 고른 뒤 「저장」을 누르세요.</small></div>
      <label class="fl" style="grid-column:1/-1">계약금 안내<input name="refund"></label>
      <label class="fl" style="grid-column:1/-1">맺음말<textarea name="closing" rows="4"></textarea></label>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn2 pri" type="submit">저장</button>
      <a class="btn2" href="print.html?sample=1">견적서 모양 미리 보기</a>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <div class="card" style="margin-top:14px">
    <h2 style="margin:0 0 6px;font-size:20px">👷 직원 기기 모드</h2>
    <p class="sub" style="margin:0 0 10px">직원에게 맡기는 휴대폰·태블릿에서 켜 두세요. 견적·지시서·사진은 그대로 쓰고, <b>가격표·회사 설정·매출·지출 화면</b>은 사장님 번호를 넣어야 열립니다. (이 기기에만 적용, 번호는 이 기기에 암호화해 둡니다)</p>
    <p id="stS" style="font-weight:800;margin:0 0 8px"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="stN" type="password" inputmode="numeric" autocomplete="new-password" placeholder="사장님 번호 (숫자 4자리 이상)" style="font:inherit;font-size:18px;padding:10px;border:1px solid #CDBBA3;border-radius:10px;flex:1;min-width:200px"><button class="btn2 pri" type="button" id="stOn">켜기</button><button class="btn2" type="button" id="stOff">끄기</button></div>
    <p class="msg" id="stMsg" role="status"></p>
  </div>
</div>
<script src="common.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  var f = document.getElementById('f'), s = DECO.settings(), m = document.getElementById('msg');
  Array.prototype.forEach.call(f.elements, function (el) { if (el.name && s[el.name] != null) el.value = s[el.name]; });
  // 도장 사진: 240px 로 줄이고 흰 바탕을 투명하게
  (function () { var hid = f.elements.stamp, im = document.getElementById('stImg'), X = document.getElementById('stX');
    function show() { var v = hid.value; im.hidden = X.hidden = !/^data:image\//.test(v); if (!im.hidden) im.src = v; } show();
    X.onclick = function () { hid.value = ''; show(); m.className = 'msg'; m.textContent = '도장을 뺐습니다. 「저장」을 눌러 주세요.'; };
    document.getElementById('stF').onchange = function () { var fl = this.files && this.files[0]; this.value = ''; if (!fl) return; var u = URL.createObjectURL(fl), g = new Image();
      g.onload = function () { var k = Math.min(1, 240 / Math.max(g.width, g.height)), c = document.createElement('canvas'); c.width = Math.round(g.width * k); c.height = Math.round(g.height * k); var x = c.getContext('2d'); x.drawImage(g, 0, 0, c.width, c.height);
        var d = x.getImageData(0, 0, c.width, c.height), p = d.data; for (var i = 0; i < p.length; i += 4) { var mn = Math.min(p[i], p[i + 1], p[i + 2]); if (mn > 200) p[i + 3] = 0; else if (mn > 150) p[i + 3] = Math.round((200 - mn) / 50 * 255); } x.putImageData(d, 0, 0);
        hid.value = c.toDataURL('image/png'); URL.revokeObjectURL(u); show(); m.className = 'msg'; m.textContent = '도장을 넣었습니다. 「저장」을 눌러야 견적서에 들어갑니다.'; };
      g.src = u; }; })();
  function stS() { document.getElementById('stS').textContent = DECO.staff() ? '🔒 지금 이 기기는 직원 기기 모드입니다' : '지금은 꺼져 있습니다 (사장님 기기)'; } stS();
  document.getElementById('stOn').onclick = function () { var v = document.getElementById('stN').value.trim(), M = document.getElementById('stMsg');
    if (!/^\d{4,}$/.test(v)) { M.className = 'msg bad'; M.textContent = '숫자 4자리 이상으로 넣어 주세요.'; return; }
    DECO.sha(v).then(function (h) { try { localStorage.setItem('deco-staff', h); sessionStorage.removeItem('deco-unlock'); } catch (e) {} document.getElementById('stN').value = ''; stS(); M.className = 'msg'; M.textContent = '켰습니다. 번호를 잊지 마세요. 이 화면을 다시 열 때부터 번호를 묻습니다.'; }); };
  document.getElementById('stOff').onclick = function () { var M = document.getElementById('stMsg'); if (!DECO.staff()) { M.className = 'msg'; M.textContent = '이미 꺼져 있습니다.'; return; }
    DECO.sha(document.getElementById('stN').value.trim()).then(function (h) { if (h !== DECO.staff()) { M.className = 'msg bad'; M.textContent = '끄려면 켤 때 넣은 번호를 넣어 주세요.'; return; } try { localStorage.removeItem('deco-staff'); } catch (e) {} document.getElementById('stN').value = ''; stS(); M.className = 'msg'; M.textContent = '껐습니다.'; }); };
  f.addEventListener('submit', function (e) {
    e.preventDefault(); var o = {};
    Array.prototype.forEach.call(f.elements, function (el) { if (el.name) o[el.name] = el.value.trim(); });
    o.validDays = Math.max(1, parseInt(o.validDays, 10) || 30);
    var ok = DECO.saveSettings(o); m.className = 'msg' + (ok ? '' : ' bad'); m.textContent = ok ? '저장했습니다. 다음 견적서부터 반영됩니다.' : '저장하지 못했습니다.';
  });
})();
</script>
</body>
</html>
