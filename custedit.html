<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>손님 화면 금액·내역 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;display:grid;gap:12px}
.pc.off{opacity:.55}
.pc h2{margin:0;font-size:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pc h2 .bd{font-size:14px;background:#FEE500;color:#191919;border-radius:999px;padding:3px 10px}
.pc label{display:grid;gap:4px;font-size:16px;font-weight:700}
.pc input,.pc textarea{font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fff;width:100%;box-sizing:border-box;min-width:0}
.pc textarea{min-height:90px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 170px;gap:8px}
.chk{display:flex!important;align-items:center;gap:8px;font-size:17px}
.chk input{width:24px;height:24px}
.sec{font-size:17px;font-weight:800;margin:4px 0 0;border-bottom:2px solid var(--ink);padding-bottom:3px}
.rw{display:grid;gap:6px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
.rw.l{grid-template-columns:90px 1fr 120px 40px}
.rw.o{grid-template-columns:1fr 120px 64px 40px}
.rw.o .sub2{grid-column:1/4}
.rw button.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-size:18px;cursor:pointer}
.ad{font:inherit;font-size:16px;font-weight:700;border:1px dashed var(--bd);background:#FBF6EE;border-radius:10px;padding:10px;cursor:pointer}
.sm{font:inherit;font-size:15px;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
.won{font-size:14px;color:var(--muted);font-weight:400}
.bar{position:sticky;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 0 max(10px,env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.bar button{min-height:56px;border:0;border-radius:14px;background:#1d1714;color:#f6c477;font:inherit;font-size:19px;font-weight:800;cursor:pointer}
.msg{margin:0;font-weight:700;color:var(--ok);min-height:1.3em}
.msg.bad{color:#b3261e}
@media (max-width:520px){.two{grid-template-columns:1fr}.rw.l{grid-template-columns:1fr 110px 40px}.rw.l .g{grid-column:1/4}}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
<link rel="stylesheet" href="design.css">
<script src="design.js" defer></script>
</head>
<body class="app">
<div class="page" style="max-width:760px">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">🧾 손님 화면 금액·내역</h1>
  <p class="sub" style="margin-top:0">① 금액·내역을 고치고 ② 맨 아래 「저장하고 손님 화면에 올리기」를 누르면, 손님 링크와 견적 프로그램에 같이 반영됩니다.</p>
  <p style="margin:0 0 14px"><a class="sm" href="emodel.html?c=1" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">👀 손님 화면 미리 보기</a></p>
  <div id="list"></div>
  <div class="bar"><button type="button" id="save">💾 저장하고 손님 화면에 올리기</button><p class="msg" id="msg" role="status"></p></div>
</div>
<script src="common.js"></script>
<script src="prices-default.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, E = DECO.esc, B = {};
  (window.DECO_PKGS0 || []).forEach(function (p) { B[p.id] = p; });
  // 손님 화면에 나오는 구성: 엘리베이터 광고 · 요즘 트렌드 · 세부 단가표 · 내역 있는 패키지
  var rk = function (p) { return p.ad ? 3 : p.trend ? 2 : p.web ? 1 : 0; };
  var P = DECO.pkgs().filter(function (p) { return p.id !== 'none' && (p.ad || p.trend || p.web || p.lines || p.opts); }).sort(function (a, b) { return rk(b) - rk(a); });
  var badge = function (p) { return p.ad ? '① 엘리베이터 광고' : p.trend ? '② 요즘 트렌드' : p.web ? '③ 세부 단가표' : ''; };
  var wonT = function (v) { v = +v || 0; return v ? (v / 10000).toLocaleString('ko-KR') + '만 원' : '0원 (포함)'; };
  function lRow(l) { return '<div class="rw l"><input class="g" value="' + E(l[0] || '') + '" placeholder="묶음 (예: 거실)" aria-label="묶음"><input class="n" value="' + E(l[1] || '') + '" placeholder="내용" aria-label="내용"><input class="v" type="number" inputmode="numeric" step="10000" value="' + (+l[2] || 0) + '" aria-label="금액(원)"><button type="button" class="x" aria-label="이 줄 지우기">×</button></div>'; }
  function oRow(o) { return '<div class="rw o" data-id="' + E(o[0] || ('u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5))) + '"><input class="n" value="' + E(o[1] || '') + '" placeholder="추가 항목 이름" aria-label="이름"><input class="v" type="number" inputmode="numeric" step="10000" value="' + (+o[2] || 0) + '" aria-label="금액(원)"><input class="u" value="' + E(o[3] || '식') + '" aria-label="단위"><button type="button" class="x" aria-label="이 줄 지우기">×</button><input class="s sub2" value="' + E(o[4] || '') + '" placeholder="작은 설명 (선택)" aria-label="작은 설명"></div>'; }
  function card(p) {
    return '<section class="pc' + (p.hide ? ' off' : '') + '" data-id="' + E(p.id) + '"><h2>' + (badge(p) ? '<span class="bd">' + badge(p) + '</span>' : '') + E(p.name) + '</h2>' +
      '<div class="two"><label>이름<input class="pn" value="' + E(p.name) + '"></label><label>총 금액 (원) <span class="won pw">' + wonT(p.price) + '</span><input class="pp" type="number" inputmode="numeric" step="10000" value="' + (+p.price || 0) + '"></label></div>' +
      '<label class="chk"><input type="checkbox" class="ps"' + (p.hide ? '' : ' checked') + '> 손님 화면에 보이기</label>' +
      '<p class="sec">기본 구성 내역</p><div class="ls">' + (p.lines || []).map(lRow).join('') + '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="ad al">+ 내역 줄 추가</button><button type="button" class="sm sum">항목 합계로 총 금액 맞추기</button></div>' +
      '<p class="sec">추가 선택 (손님이 골라서 더함)</p><div class="os">' + (p.opts || []).map(oRow).join('') + '</div>' +
      '<button type="button" class="ad ao">+ 추가 선택 항목 넣기</button>' +
      '<label>안내 문구 <span class="won">한 줄에 하나씩 (선택)</span><textarea class="nt">' + E((p.note || []).join('\n')) + '</textarea></label>' +
      '<div><button type="button" class="sm rs">↺ 이 구성만 처음대로</button></div></section>';
  }
  function draw() { $('list').innerHTML = P.map(card).join(''); }
  function say(t, bad) { $('msg').className = 'msg' + (bad ? ' bad' : ''); $('msg').textContent = t; }
  $('list').addEventListener('click', function (e) { var t = e.target, c = t.closest('.pc'); if (!c) return;
    if (t.classList.contains('x')) t.closest('.rw').remove();
    else if (t.classList.contains('al')) { c.querySelector('.ls').insertAdjacentHTML('beforeend', lRow([c.querySelector('.ls .g:last-of-type') ? '' : '', '', 0])); c.querySelector('.ls .rw:last-child .n').focus(); }
    else if (t.classList.contains('ao')) { c.querySelector('.os').insertAdjacentHTML('beforeend', oRow([])); c.querySelector('.os .rw:last-child .n').focus(); }
    else if (t.classList.contains('sum')) { var s = 0; c.querySelectorAll('.ls .v').forEach(function (i) { s += +i.value || 0; }); if (!s) { say('내역 금액이 모두 0원이라 맞출 수 없습니다.', true); return; } c.querySelector('.pp').value = s; c.querySelector('.pw').textContent = wonT(s); say('총 금액을 ' + wonT(s) + '으로 맞췄습니다. 저장을 눌러 주세요.'); }
    else if (t.classList.contains('rs')) { var id = c.dataset.id, ed = DECO.priceEdits(); ed.pkgs = ed.pkgs || {}; delete ed.pkgs[id]; DECO.savePriceEdits(ed); try { DECO.pubPkgs(); } catch (x) {} P = P.map(function (p) { return p.id === id ? DECO.pkgs().filter(function (q) { return q.id === id; })[0] : p; }); draw(); say('처음 내용으로 되돌리고 손님 화면에도 올렸습니다.'); }
  });
  $('list').addEventListener('input', function (e) { if (e.target.classList.contains('pp')) e.target.closest('.pc').querySelector('.pw').textContent = wonT(e.target.value); });
  $('list').addEventListener('change', function (e) { if (e.target.classList.contains('ps')) e.target.closest('.pc').classList.toggle('off', !e.target.checked); });
  var same = function (a, b) { return JSON.stringify(a || null) === JSON.stringify(b || null); };
  $('save').onclick = function () {
    var ed = DECO.priceEdits(); ed.pkgs = ed.pkgs || {};
    document.querySelectorAll('.pc').forEach(function (c) { var id = c.dataset.id, b = B[id], e = ed.pkgs[id] || {}; if (!b) return;
      var nm = c.querySelector('.pn').value.trim(), pr = Math.max(0, parseInt(c.querySelector('.pp').value, 10) || 0);
      var L = [].map.call(c.querySelectorAll('.ls .rw'), function (r) { return [r.querySelector('.g').value.trim(), r.querySelector('.n').value.trim(), Math.max(0, +r.querySelector('.v').value || 0)]; }).filter(function (l) { return l[1]; });
      var O = [].map.call(c.querySelectorAll('.os .rw'), function (r) { var o = [r.dataset.id, r.querySelector('.n').value.trim(), Math.max(0, +r.querySelector('.v').value || 0), r.querySelector('.u').value.trim() || '식'], s = r.querySelector('.s').value.trim(); if (s) o.push(s); return o; }).filter(function (o) { return o[1]; });
      var N = c.querySelector('.nt').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      if (nm && nm !== b.name) e.name = nm; else delete e.name;
      if (pr !== b.price) e.price = pr; else delete e.price;
      if (!c.querySelector('.ps').checked) e.hide = true; else delete e.hide;
      if (!same(L.length ? L : null, b.lines && b.lines.length ? b.lines : null)) { e.lines = L; delete e.desc; } else delete e.lines;
      if (!same(O.length ? O : null, b.opts && b.opts.length ? b.opts : null)) e.opts = O; else delete e.opts;
      if (!same(N.length ? N : null, b.note && b.note.length ? b.note : null)) e.note = N; else delete e.note;
      if (Object.keys(e).length) ed.pkgs[id] = e; else delete ed.pkgs[id];
    });
    var ok = DECO.savePriceEdits(ed), up = false; try { up = DECO.pubPkgs() !== false; } catch (x) {}
    say(ok ? '✔ 저장했습니다. 손님 화면·새 견적에 반영됩니다.' + (up ? '' : ' (바뀐 내용 없음)') : '저장하지 못했습니다.', !ok);
  };
  draw();
})();
</script>
</body>
</html>
