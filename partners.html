<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>거래처 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
.fl select{font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;background:#fff}
h2.s{font-size:20px;margin:22px 0 8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.p{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);padding:10px 12px;margin-bottom:5px}
.p b{font-size:18px}
.p small{display:block;color:var(--muted);font-size:14px}
.p .a{display:flex;gap:6px;flex-wrap:wrap}
.p .a .btn2{height:40px;font-size:15px;padding:0 12px}
</style>
</head>
<body class="app">
<div class="page" style="max-width:820px">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">거래처</h1>
  <p class="sub">작업 지시를 내리는 목수·전기·도배 거래처입니다. 여기 넣어 두면 작업 지시서에서 골라 문자로 바로 보낼 수 있습니다.</p>
  <form class="card" id="f" autocomplete="off">
    <div class="grid2">
      <label class="fl">공종<select name="trade" id="trade"></select></label>
      <label class="fl"><span class="need">이름·상호</span><input name="name" required placeholder="예: 김목수"></label>
      <label class="fl"><span class="need">휴대폰</span><input name="phone" required inputmode="tel" placeholder="010-0000-0000"></label>
      <label class="fl">기본 금액(원)<input name="rate" type="number" inputmode="numeric" min="0" step="10000" placeholder="예: 250000 (하루 일당)"></label>
      <label class="fl">메모<input name="memo" placeholder="예: 오전만 가능, 일당 ○○"></label>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn2 pri" type="submit" id="sv">거래처 추가</button>
      <button class="btn2" type="button" id="cancel" hidden>새로 넣기</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <p><button class="btn2" type="button" id="vcfAll">📇 거래처 모두 휴대폰 연락처에 저장</button> <span class="msg" id="vMsg" role="status"></span></p>
  <div id="box"></div>
</div>
<script src="common.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, E = DECO.esc, f = $('f'), ed = null;
  $('trade').innerHTML = DECO.TRADES.map(function (t) { return '<option>' + t + '</option>'; }).join('');
  function work(p) { var mk = DECO.today().slice(0, 7), n = 0, a = 0, un = 0;
    DECO.orders().forEach(function (o) { var b = o.trades && o.trades[p.trade]; if (!b || !b.on || b.partner !== p.id) return; var c = +(o.cost || {})[p.trade] || 0;
      if ((o.workDate || '').slice(0, 7) === mk) { n++; a += c; } if (c && !(o.costPaid || {})[p.trade]) un += c; });
    var rs = []; DECO.orders().forEach(function (o) { var r = o.prate && o.prate[p.trade]; if (r && r.s && r.pid === p.id) rs.push(r); }); rs.sort(function (x, y) { return y.at - x.at; });
    var av = rs.length ? rs.reduce(function (s, r) { return s + r.s; }, 0) / rs.length : 0, lm = rs.filter(function (r) { return r.m; })[0];
    return (rs.length ? ' · <b style="color:#B7791F">★ ' + av.toFixed(1) + '</b> (' + rs.length + '번)' + (lm ? ' 「' + DECO.esc(lm.m) + '」' : '') : '') + (n ? ' · 이달 ' + n + '곳' + (a ? ' ' + DECO.won(a) : '') : '') + (un ? ' · <b style="color:#b5462f">안 준 돈 ' + DECO.won(un) + '</b>' : ''); }
  function draw() { var A = DECO.partners();
    $('box').innerHTML = DECO.TRADES.map(function (t) { var L = A.filter(function (p) { return p.trade === t; });
      return '<h2 class="s">' + t + ' (' + L.length + ')</h2>' + (L.length ? L.map(function (p) { var tel = String(p.phone).replace(/[^\d+]/g, '');
        return '<div class="p"><div><b>' + E(p.name) + '</b><small>' + E(p.phone) + (p.memo ? ' · ' + E(p.memo) : '') + work(p) + '</small></div><div class="a">' +
          '<a class="btn2" href="tel:' + tel + '">전화</a><a class="btn2" href="sms:' + tel + '">문자</a><button class="btn2" type="button" data-wk="' + p.id + '" style="background:#FEE500;border-color:#FEE500;color:#191919;font-weight:800">📅 이번 주 일정 카톡</button><button class="btn2" type="button" data-ed="' + p.id + '">고치기</button><button class="btn2 no" type="button" data-del="' + p.id + '">지우기</button></div></div>'; }).join('')
        : '<div class="empty">' + t + ' 거래처가 없습니다.</div>'); }).join(''); }
  $('vcfAll').addEventListener('click', function () { DECO.vcf(DECO.partners().map(function (p) { return { fn: p.name + ' (' + p.trade + ')', phone: p.phone, note: p.memo }; }), '거래처.vcf').then(function (t) { $('vMsg').textContent = t; }); });
  function reset() { ed = null; f.reset(); $('sv').textContent = '거래처 추가'; $('cancel').hidden = true; }
  f.addEventListener('submit', function (e) { e.preventDefault(); var p = ed || {};
    ['trade', 'name', 'phone', 'memo', 'rate'].forEach(function (k) { p[k] = f.elements[k].value.trim(); });
    var r = DECO.savePartner(p); $('msg').className = 'msg' + (r ? '' : ' bad'); $('msg').textContent = r ? p.name + ' (' + p.trade + ') 저장했습니다.' : '저장하지 못했습니다.'; if (r) { reset(); draw(); } });
  $('cancel').addEventListener('click', reset);
  $('box').addEventListener('click', function (e) { var b = e.target.closest('[data-wk]'); if (!b) return; var p = DECO.partners().filter(function (x) { return x.id === b.dataset.wk; })[0]; if (!p) return;
    var t0 = DECO.today(), t7 = DECO.ymd(new Date(Date.now() + 6 * 864e5)), L = DECO.orders().filter(function (o) { var x = o.trades && o.trades[p.trade]; return x && x.on && x.partner === p.id && o.workDate && o.workDate >= t0 && o.workDate <= t7 && o.status !== '보류'; }).sort(function (a, c) { return (a.workDate + (a.trades[p.trade].time || '')).localeCompare(c.workDate + (c.trades[p.trade].time || '')); });
    var lines = L.map(function (o) { var d = new Date(o.workDate + 'T00:00'), x = o.trades[p.trade]; return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + '일월화수목금토'[d.getDay()] + ') ' + (x.time || '') + '  ' + (o.addr || o.name || '현장') + (x.tasks ? '\n   - ' + String(x.tasks).split('\n').filter(Boolean).join(', ') : ''); });
    DECO.kakao(DECO.kfmt({ icon: '📅', title: '이번 주 작업 일정', info: [['👷', '받는 분', p.name + ' 님 (' + p.trade + ')'], ['🗓', '기간', t0.slice(5).replace('-', '/') + ' ~ ' + t7.slice(5).replace('-', '/')], ['📌', '현장 수', L.length + '곳']],
      secs: [['일정', lines.length ? lines : ['이번 주 잡힌 일정이 없습니다']]], foot: ['일정 확인 부탁드립니다. 어려운 날은 미리 말씀해 주세요. 🙏'] }), p.name + ' 님 이번 주 일정'); });
  $('box').addEventListener('click', function (e) { var b = e.target.closest('[data-ed],[data-del]'); if (!b) return; var A = DECO.partners();
    if (b.dataset.del) { var d = A.filter(function (x) { return x.id === b.dataset.del; })[0]; if (d && confirm(d.name + ' 거래처를 지울까요?')) { DECO.delPartner(d.id); draw(); } return; }
    ed = A.filter(function (x) { return x.id === b.dataset.ed; })[0]; ['trade', 'name', 'phone', 'memo', 'rate'].forEach(function (k) { f.elements[k].value = ed[k] || ''; });
    $('sv').textContent = '고친 내용 저장'; $('cancel').hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' }); });
  draw();
})();
</script>
</body>
</html>
