<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메모장 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input{flex:1 1 220px;font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;height:46px}
.ed{display:flex;flex-direction:column;gap:8px}
.ed input,.ed textarea{font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
.ed input{font-weight:700}
.ed .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{font:inherit;font-size:15px;height:38px;padding:0 12px;border:1px solid var(--bd);background:#fff;border-radius:10px;cursor:pointer}
.cats button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:14px}
.m{background:#fff;border:1px solid var(--line);border-top:4px solid var(--line);padding:12px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:120px}
.m:hover{border-color:var(--pri)}
.m.pin{border-top-color:var(--warm)}
.m b{font-size:17px}
.m p{margin:0;color:var(--ink2);font-size:15px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.m small{color:var(--muted);font-size:13px;margin-top:auto}
</style>
</head>
<body class="app">
<div class="page">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">메모장</h1>
  <p class="sub">자재 주문, 전화 받은 내용, 할 일 등을 적어 두세요. 쓰는 동안 저절로 저장됩니다. (이 기기에만 저장)</p>
  <section class="card ed" id="ed">
    <input id="tt" placeholder="제목 (예: 다음 주 자재 주문)" aria-label="제목">
    <textarea id="bd" rows="6" placeholder="내용" aria-label="내용"></textarea>
    <div class="r">
      <div class="cats" id="cats" role="group" aria-label="분류"></div>
      <label style="display:flex;gap:6px;align-items:center;font-size:15px"><input type="checkbox" id="pin" style="width:20px;height:20px"> 맨 위에 고정</label>
    </div>
    <div class="r">
      <button class="btn2 pri" type="button" id="nw">+ 새 메모</button>
      <button class="btn2" type="button" id="cp">내용 복사</button>
      <button class="btn2 no" type="button" id="dl" hidden>이 메모 지우기</button>
      <span class="msg" id="msg" role="status" style="margin:0"></span>
    </div>
  </section>
  <div class="bar" style="margin-top:18px"><input id="qs" type="search" placeholder="메모 찾기" aria-label="메모 찾기"></div>
  <div class="cats" id="fcats" role="group" aria-label="분류로 거르기"></div>
  <div class="list" id="list"></div>
</div>
<script src="common.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, E = DECO.esc, CATS = ['할 일', '자재', '상담', '현장', '기타'], cur = null, cat = '할 일', fc = '', timer = null;
  function chips(el, val, all) { el.innerHTML = (all ? ['전체'] : []).concat(CATS).map(function (c) { var v = c === '전체' ? '' : c; return '<button type="button" data-c="' + v + '" aria-pressed="' + (v === val) + '">' + c + '</button>'; }).join(''); }
  function open(m) { cur = m; $('tt').value = m ? m.title : ''; $('bd').value = m ? m.body : ''; $('pin').checked = !!(m && m.pin); cat = (m && m.cat) || '할 일'; chips($('cats'), cat); $('dl').hidden = !m; $('msg').textContent = m ? DECO.date(m.updated) + ' 저장됨' : ''; }
  function save() { var t = $('tt').value.trim(), b = $('bd').value.trim(); if (!t && !b) return;
    var m = cur || {}; m.title = t; m.body = b; m.cat = cat; m.pin = $('pin').checked; var r = DECO.saveMemo(m);
    if (r) { cur = r; $('dl').hidden = false; $('msg').className = 'msg'; $('msg').textContent = '저장됨'; draw(); } else { $('msg').className = 'msg bad'; $('msg').textContent = '저장하지 못했습니다.'; } }
  function later() { clearTimeout(timer); timer = setTimeout(save, 600); }
  function draw() { var k = $('qs').value.trim(), L = DECO.memos().filter(function (m) { return (!fc || m.cat === fc) && (!k || (m.title + ' ' + m.body).indexOf(k) >= 0); });
    $('list').innerHTML = L.length ? L.map(function (m) { return '<button type="button" class="m' + (m.pin ? ' pin' : '') + '" data-id="' + m.id + '"><b>' + (m.pin ? '📌 ' : '') + E(m.title || '(제목 없음)') + '</b><p>' + E(m.body) + '</p><small>' + E(m.cat) + ' · ' + DECO.date(m.updated) + '</small></button>'; }).join('')
      : '<div class="empty" style="grid-column:1/-1">' + (k || fc ? '찾는 메모가 없습니다.' : '아직 메모가 없습니다. 위에 적으면 저절로 저장됩니다.') + '</div>'; }
  $('tt').addEventListener('input', later); $('bd').addEventListener('input', later); $('pin').addEventListener('change', save);
  $('cats').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; chips($('cats'), cat); save(); });
  $('fcats').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; fc = b.dataset.c; chips($('fcats'), fc, true); draw(); });
  $('list').addEventListener('click', function (e) { var b = e.target.closest('.m'); if (!b) return; clearTimeout(timer); save(); open(DECO.memos().filter(function (m) { return m.id === b.dataset.id; })[0]); window.scrollTo({ top: 0, behavior: 'smooth' }); $('bd').focus(); });
  $('nw').addEventListener('click', function () { clearTimeout(timer); save(); open(null); $('tt').focus(); });
  $('cp').addEventListener('click', function () { var t = ($('tt').value + '\n' + $('bd').value).trim(); navigator.clipboard && navigator.clipboard.writeText(t).then(function () { $('msg').textContent = '복사했습니다.'; }); });
  $('dl').addEventListener('click', function () { if (!cur || !confirm('이 메모를 지울까요?\n지운 메모는 되살릴 수 없습니다.')) return; DECO.delMemo(cur.id); open(null); draw(); $('msg').textContent = '지웠습니다.'; });
  $('qs').addEventListener('input', draw);
  window.addEventListener('pagehide', function () { clearTimeout(timer); save(); });
  chips($('fcats'), '', true); open(null); draw();
})();
</script>
</body>
</html>
