<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고객 관리 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar select{max-width:100%;flex:1 1 200px;min-width:0}
.bar input,.bar select{font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;height:46px;background:#fff}
.bar input{flex:1 1 240px}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:560px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum div{background:#fff;border:1px solid var(--line);padding:8px 14px;font-size:14px;color:var(--muted)}
.sum b{display:block;font-size:22px;color:var(--ink)}
.c{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:12px 14px;margin-bottom:6px;color:var(--ink);text-decoration:none}
.c:hover{border-color:var(--pri)}
.c h3{margin:0;font-size:19px}
.c .m{color:var(--muted);font-size:14px}
.c .r{text-align:right;white-space:nowrap}
.c .r b{display:block;font-size:17px}
.tag{display:inline-block;font-size:13px;padding:0 6px;border:1px solid var(--pri);color:var(--pri);margin-left:6px;vertical-align:2px}
</style>
</head>
<body class="app">
<div class="page">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">고객 관리</h1>
  <p class="sub">견적을 저장하면 고객이 자동으로 등록됩니다(같은 전화번호는 한 사람으로 묶음). 눌러서 상담 기록·견적·시공 내역을 봅니다.</p>
  <div class="sum" id="sum"></div>
  <div class="bar">
    <input id="qs" type="search" placeholder="이름·전화번호·주소로 찾기" aria-label="고객 찾기">
    <select id="fs" aria-label="진행 상태로 거르기"></select>
    <a class="btn2 pri" href="customer.html">+ 고객 등록</a>
    <button class="btn2" type="button" id="kSea" style="background:#FEE500;border-color:#FEE500;color:#191919;font-weight:800">🌤 계절 안내 카톡</button>
  </div>
  <details id="refD" hidden style="background:#FFF8EC;border:2px solid #E0952B;border-radius:14px;padding:12px 14px;margin:0 0 14px"><summary style="font-size:18px;font-weight:800;cursor:pointer" id="refS"></summary><div id="refB"></div></details>
  <div id="box"></div>
</div>
<script src="common.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  DECO.syncCustomers();
  var E = DECO.esc, qs = document.getElementById('qs'), fs = document.getElementById('fs'), box = document.getElementById('box');
  var C = DECO.customers().map(function (c) {
    var Q = DECO.custQuotes(c), st = Q.length ? (Q[0].status || '상담') : '견적 전';
    var won = Q.filter(function (q) { return ['계약', '시공', '완료'].indexOf(q.status) >= 0; }).reduce(function (s, q) { return s + ((q.totals && q.totals.total) || 0); }, 0);
    var due = Q.filter(function (q) { return ['계약', '시공', '완료'].indexOf(q.status) >= 0; }).reduce(function (s, q) { return s + Math.max(0, ((q.totals && q.totals.total) || 0) - (q.pays || []).reduce(function (a, p) { return a + (+p.amt || 0); }, 0)); }, 0);
    var last = Math.max(c.touched || 0, c.updated || 0, Q.length ? Q[0].updated || 0 : 0, c.logs && c.logs.length ? new Date(c.logs[c.logs.length - 1].date + 'T12:00').getTime() || 0 : 0);
    var nc = Q.filter(function (q) { return ['계약', '시공', '완료'].indexOf(q.status) >= 0; }).length, nr = c.name ? DECO.customers().filter(function (y) { return y.id !== c.id && y.ref && String(y.ref).indexOf(c.name) === 0; }).length : 0;
    return { nc: nc, nr: nr, c: c, n: Q.length, st: st, won: won, due: due, ago: last ? Math.floor((Date.now() - last) / 864e5) : 999 };
  });
  fs.innerHTML = '<option value="">전체 상태</option><option value="_call">☎ 연락할 고객 (상담·실측, 3일 넘게 연락 없음)</option><option value="_due">💰 받을 돈 남은 고객</option>' + ['견적 전'].concat(DECO.STATUS).map(function (s) { return '<option>' + s + '</option>'; }).join('');
  var cnt = function (s) { return C.filter(function (x) { return x.st === s; }).length; };
  document.getElementById('sum').innerHTML = '<div>전체 고객<b>' + C.length + '명</b></div><div>상담·실측 중<b>' + (cnt('상담') + cnt('실측') + cnt('견적 전')) + '명</b></div><div>계약·시공<b>' + (cnt('계약') + cnt('시공')) + '명</b></div><div>완료<b>' + cnt('완료') + '명</b></div>';
  function draw() {
    var k = qs.value.trim(), kd = k.replace(/\D/g, '');
    var L = C.filter(function (x) { var c = x.c; if (fs.value === '_call') { if (!((x.st === '상담' || x.st === '실측' || x.st === '견적 전') && x.ago >= 3)) return false; } else if (fs.value === '_due') { if (!x.due) return false; } else if (fs.value && x.st !== fs.value) return false; if (!k) return true;
      return [c.name, c.addr].join(' ').indexOf(k) >= 0 || (kd.length >= 3 && String(c.phone).replace(/\D/g, '').indexOf(kd) >= 0); });
    if (fs.value === '_call') L.sort(function (a, b) { return a.ago - b.ago; }); if (fs.value === '_due') L.sort(function (a, b) { return b.due - a.due; });
    if (!L.length) { box.innerHTML = '<div class="empty">' + (k || fs.value ? '찾는 고객이 없습니다.' : '아직 고객이 없습니다. 견적을 저장하거나 「+ 고객 등록」을 누르세요.') + '</div>'; return; }
    box.innerHTML = L.map(function (x) { var c = x.c;
      return '<a class="c" href="customer.html?id=' + encodeURIComponent(c.id) + '"><div><h3>' + E(c.name || '이름 없음') + ' 님<span class="tag">' + E(x.st) + '</span>' + (x.nc >= 2 ? '<span class="tag" style="background:#FFF1D6;color:#8A5A12;border-color:#E9C27A">🏅 단골 ' + x.nc + '번</span>' : '') + (x.nr ? '<span class="tag" style="background:#E8F3EC;color:#2E6A4E;border-color:#9BC7AE">🤝 소개 ' + x.nr + '명</span>' : '') + '</h3>' +
        '<div class="m">' + E(c.phone || '전화 없음') + (c.addr ? ' · ' + E(c.addr) : '') + '</div>' +
        '<div class="m">견적 ' + x.n + '건' + (c.source ? ' · ' + E(c.source) : '') + (c.logs && c.logs.length ? ' · 최근 상담 ' + E(c.logs[c.logs.length - 1].date) : '') + (x.ago < 999 ? ' · ' + (x.ago ? x.ago + '일 전 연락' : '오늘 연락') : '') + (x.due ? ' · <b style="color:#b5462f">받을 돈 ' + DECO.won(x.due) + '</b>' : '') + '</div></div>' +
        '<div class="r">' + (x.won ? '<b>' + DECO.won(x.won) + '</b><span class="m">계약 금액</span>' : '') + '</div></a>';
    }).join('');
  }
  // 🎁 소개해 주신 분: 소개 인원·계약 인원·감사 카톡·혜택 기록
  function refDraw() { var G = {}; C.forEach(function (x) { var r = (x.c.ref || '').trim(); if (!r) return; (G[r] = G[r] || []).push(x); });
    var ks = Object.keys(G).sort(function (a, b) { return G[b].length - G[a].length; }), D0 = document.getElementById('refD'); if (!ks.length) { D0.hidden = true; return; }
    D0.hidden = false; document.getElementById('refS').textContent = '🎁 소개해 주신 분 ' + ks.length + '명 · 소개로 오신 고객 ' + ks.reduce(function (s, k) { return s + G[k].length; }, 0) + '명';
    document.getElementById('refB').innerHTML = ks.map(function (k, i) { var L = G[k], ok = L.filter(function (x) { return ['계약', '시공', '완료'].indexOf(x.st) >= 0; }).length, rc = DECO.customers().filter(function (c) { return (c.name || '').trim() === k; })[0], P = (rc && rc.perks) || [];
      return '<div style="border-top:1px solid #ecdcc4;padding:10px 0;margin-top:6px"><b style="font-size:18px">' + (i < 3 ? ['🥇', '🥈', '🥉'][i] + ' ' : '') + (rc ? '<a href="customer.html?id=' + encodeURIComponent(rc.id) + '">' + E(k) + ' 님</a>' : E(k) + ' 님') + '</b>' +
        '<div class="m" style="font-size:16px">소개 ' + L.length + '명 (' + L.map(function (x) { return E(x.c.name || '이름 없음') + ' · ' + E(x.st); }).join(', ') + ') · 계약 <b>' + ok + '명</b></div>' +
        (P.length ? '<div class="m" style="color:#2E6A4E;font-weight:700">🎁 드린 혜택: ' + P.map(function (p) { return E(p.d) + ' ' + E(p.what); }).join(' / ') + '</div>' : '<div class="m" style="color:#B5541C">아직 감사 혜택 기록이 없습니다</div>') +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"><button type="button" class="btn2" data-rk="' + E(k) + '" style="background:#FEE500;border-color:#FEE500;color:#191919;font-weight:800">💬 감사 카톡</button>' +
        (rc ? '<input data-pv="' + E(rc.id) + '" placeholder="예: 상품권 3만 원" style="flex:1;min-width:140px;font:inherit;font-size:16px;padding:8px;border:1px solid #d8cfc6;border-radius:8px"><button type="button" class="btn2" data-pk="' + E(rc.id) + '">🎁 혜택 기록</button>' : '<small class="m">고객으로 등록하면 혜택을 기록할 수 있습니다</small>') + '</div></div>'; }).join('');
    REFG = G; }
  var REFG = {};
  document.getElementById('refB').addEventListener('click', function (e) { var b = e.target.closest('[data-rk],[data-pk]'); if (!b) return;
    if (b.dataset.pk) { var c = DECO.getCustomer(b.dataset.pk), inp = document.querySelector('[data-pv="' + b.dataset.pk + '"]'), w = inp && inp.value.trim(); if (!c || !w) { if (inp) inp.focus(); return; }
      c.perks = (c.perks || []).concat([{ d: DECO.date(Date.now()), what: w }]); DECO.saveCustomer(c); refDraw(); return; }
    var k = b.dataset.rk, L = REFG[k] || [], s = DECO.settings();
    DECO.kakao(DECO.kfmt({ icon: '🙏', title: '소개 감사 인사', info: [['👤', '받는 분', k + ' 님'], ['🤝', '소개 인원', L.length + '명']],
      secs: [['소개해 주신 고객', L.map(function (x) { return (x.c.name || '고객') + ' 님'; })]],
      foot: [k + ' 님, 좋은 분을 소개해 주셔서 진심으로 감사드립니다. 덕분에 좋은 인연이 되었습니다.', '작은 감사의 마음을 준비했습니다. 시공하신 조명·실링팬에 불편한 점이 있으면 언제든 연락 주세요. 🙏'] }), '소개 감사 카톡'); });
  refDraw();
  // 계절 안내: 시공 끝난 고객에게 (카톡 단체·개별로 붙여넣기)
  document.getElementById('kSea').onclick = function () { var m = new Date().getMonth() + 1, s = DECO.settings(), W0 = C.filter(function (x) { return x.st === '완료' && x.c.phone; });
    var S0 = m >= 5 && m <= 8 ? ['☀ 여름 준비 안내', ['실링팬을 정방향(시계 반대)으로 돌리면 시원한 바람이 내려옵니다', '에어컨과 같이 쓰면 전기 요금을 줄일 수 있습니다', '날개에 쌓인 먼지는 마른 천으로 닦아 주세요'], '집에 실링팬이 없는 방도 여름 전에 달아 드립니다.']
      : m >= 11 || m <= 2 ? ['❄ 겨울 준비 안내', ['실링팬을 역방향(시계 방향)·약풍으로 돌리면 천장의 따뜻한 공기가 내려옵니다', '전구색(따뜻한 빛) 간접등은 집을 더 포근하게 보이게 합니다', '연말 손님맞이 전 조명 점검도 해 드립니다'], '따뜻한 빛 조명으로 바꾸고 싶은 곳이 있으면 말씀해 주세요.']
      : ['🌸 환절기 점검 안내', ['간접등 한쪽이 어둡거나 깜빡이면 알려 주세요', '실링팬 흔들림·소리는 나사 조임으로 대부분 해결됩니다', '이사·입주 앞두신 지인이 있으면 소개 부탁드립니다'], '무상 점검 기간이면 방문 점검해 드립니다.'];
    DECO.kakao(DECO.kfmt({ icon: S0[0].split(' ')[0], title: S0[0].replace(/^\S+\s/, ''), secs: [['알아 두시면 좋아요', S0[1]]], foot: ['안녕하세요, 데코브라이트 시공 고객님! ' + S0[2], '궁금한 점은 편하게 답장 주세요. 🙏'] }), '계절 안내 카톡 · 보낼 고객 ' + W0.length + '명'); };
  qs.addEventListener('input', draw); fs.addEventListener('change', draw); draw();
})();
</script>
</body>
</html>
