<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고객 관리 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar select{max-width:100%;flex:1 1 200px;min-width:0}
.bar input,.bar select{font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;height:46px;background:#fff}
.bar input{flex:1 1 240px}
#flt input,#flt select{font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:0 10px;height:46px;background:#fff;min-width:0;width:100%;box-sizing:border-box}#flt select:disabled{opacity:.55}#fCu input{flex:1 1 140px;width:auto}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:0 0 12px}
.cat button{font:inherit;cursor:pointer;background:#fff;border:2px solid var(--line);border-left:7px solid var(--cc,#7A6E66);border-radius:10px;padding:8px 10px;text-align:left;color:var(--ink);min-height:64px}
.cat button span{display:block;font-size:16px;font-weight:700}
.cat button b{display:block;font-size:24px;line-height:1.2}
.cat button[aria-pressed="true"]{background:var(--cc,#3B2F2A);border-color:var(--cc,#3B2F2A);color:#fff}
.cat button.zero{opacity:.5}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:560px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum div{background:#fff;border:1px solid var(--line);padding:8px 14px;font-size:14px;color:var(--muted)}
.sum b{display:block;font-size:22px;color:var(--ink)}
.c{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:12px 14px;margin-bottom:6px;color:var(--ink);text-decoration:none}
.c:hover{border-color:var(--pri)}
.c h3{margin:0;font-size:19px}
.c .m{color:var(--muted);font-size:14px}
.c .r{text-align:right;white-space:nowrap}
.c .r b{display:block;font-size:17px}
.tag{display:inline-block;font-size:13px;padding:0 6px;border:1px solid var(--pri);color:var(--pri);margin-left:6px;vertical-align:2px}
</style>
</head>
<body class="app">
<div class="page">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">고객 관리</h1>
  <p class="sub">견적을 저장하면 고객이 자동으로 등록됩니다(같은 전화번호는 한 사람으로 묶음). 눌러서 상담 기록·견적·시공 내역을 봅니다.</p>
  <div class="cat" id="sum" role="group" aria-label="진행 상태별 고객"></div>
  <div class="bar">
    <input id="qs" type="search" placeholder="이름·전화번호·주소로 찾기" aria-label="고객 찾기">
    <select id="fs" aria-label="진행 상태로 거르기" hidden></select>
    <a class="btn2 pri" href="customer.html">+ 고객 등록</a>
    <button class="btn2" type="button" id="kSea" style="background:#FEE500;border-color:#FEE500;color:#191919;font-weight:800">🌤 계절 안내 카톡</button>
  </div>
  <div id="flt" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px;background:#FFF8EC;border:1px solid #E8C98A;border-radius:12px;padding:8px 10px">
    <b style="grid-column:1/-1;font-size:16px">📍 지역 (시·구)</b>
    <select id="fSi" aria-label="시·군으로 거르기"></select>
    <select id="fGu" aria-label="구(또는 읍·면·동)로 거르기"></select>
    <b style="grid-column:1/-1;font-size:16px;margin-top:4px">📅 기간</b>
    <select id="fBy" aria-label="날짜 기준"><option value="c">등록한 날</option><option value="l">최근 연락한 날</option></select>
    <select id="fPe" aria-label="기간"><option value="">전체 기간</option><option value="m0">이번 달</option><option value="m1">지난달</option><option value="m3">최근 3개월</option><option value="y0">올해</option><option value="y1">작년</option><option value="cu">날짜 직접 고르기</option></select>
    <span id="fCu" hidden style="grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input type="date" id="fD1" aria-label="시작 날짜"> ~ <input type="date" id="fD2" aria-label="끝 날짜"></span>
    <select id="fVw" aria-label="보기 방식"><option value="">최근 순</option><option value="reg">지역별 묶기</option><option value="mon">달별 묶기</option></select>
    <button class="btn2" type="button" id="fX">거르기 풀기</button>
    <span id="fN" style="grid-column:1/-1;font-weight:700"></span>
  </div>
  <details id="refD" hidden style="background:#FFF8EC;border:2px solid #E0952B;border-radius:14px;padding:12px 14px;margin:0 0 14px"><summary style="font-size:18px;font-weight:800;cursor:pointer" id="refS"></summary><div id="refB"></div></details>
  <div id="dup" hidden style="background:#FFF4F0;border:2px solid #D9826B;border-radius:14px;padding:12px 14px;margin:0 0 14px"></div>
  <div id="box"></div>
</div>
<script src="common.js"></script>
<script>
// 같은 전화번호로 두 번 이상 등록된 고객 → 하나로 합치기 (먼저 등록한 고객에 모음, 나머지는 휴지통 30일)
(function () { var $ = function (id) { return document.getElementById(id); }, E = DECO.esc, dg = function (p) { return String(p || '').replace(/\D/g, ''); };
  function groups() { var G = {}; DECO.customers().forEach(function (c) { var p = dg(c.phone); if (p.length >= 9) (G[p] = G[p] || []).push(c); });
    return Object.keys(G).filter(function (k) { return G[k].length > 1; }).map(function (k) { return G[k].sort(function (a, b) { return (a.created || 0) - (b.created || 0); }); }); }
  function draw() { var L = groups(), b = $('dup'); b.hidden = !L.length; if (!L.length) return;
    b.innerHTML = '<b style="font-size:18px">📞 같은 전화번호로 두 번 등록된 고객 ' + L.length + '쌍</b><p style="margin:4px 0 8px;font-size:15px">합치면 상담 기록·견적이 먼저 등록한 고객 한 명에게 모입니다. 나머지는 휴지통에 30일 있어 되살릴 수 있습니다.</p>' +
      L.map(function (g, i) { return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed #D9826B"><span style="font-size:16px">' + g.map(function (c) { return '<b>' + E(c.name || '이름 없음') + '</b>'; }).join(' · ') + ' <small>(' + E(g[0].phone) + ')</small></span><button class="btn2 pri" type="button" data-mg="' + i + '">하나로 합치기</button></div>'; }).join(''); }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-mg]'); if (!b) return; var g = groups()[+b.dataset.mg]; if (!g) return; var k = g[0], R = g.slice(1);
    if (!confirm('「' + (k.name || '이름 없음') + '」 한 명으로 합칠까요?\n(' + R.map(function (c) { return c.name || '이름 없음'; }).join(', ') + ' → 휴지통, 30일 안에는 되살릴 수 있습니다)')) return;
    var ids = R.map(function (c) { return c.id; });
    R.forEach(function (c) { ['name', 'addr', 'source', 'ref', 'size', 'staff'].forEach(function (f) { if (!k[f] && c[f]) k[f] = c[f]; });
      if (c.memo) k.memo = k.memo ? (k.memo.indexOf(c.memo) >= 0 ? k.memo : k.memo + '\n' + c.memo) : c.memo;
      k.logs = (k.logs || []).concat(c.logs || []); if (c.next && !k.next) k.next = c.next; if (c.asDone) k.asDone = (k.asDone || []).concat(c.asDone); k.touched = Math.max(k.touched || 0, c.touched || 0); });
    k.logs.sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); }); DECO.saveCustomer(k);
    DECO.list().forEach(function (q) { if (ids.indexOf(q.custId) >= 0) { q.custId = k.id; DECO.saveQuote(q); } });
    DECO.orders().forEach(function (o) { if (ids.indexOf(o.custId) >= 0) { o.custId = k.id; DECO.saveOrder(o); } });
    ids.forEach(function (id) { DECO.delCustomer(id); }); location.reload(); });
  draw(); })();
</script>
<script src="sync.js"></script>
<script>
(function () {
  DECO.syncCustomers();
  var E = DECO.esc, qs = document.getElementById('qs'), fs = document.getElementById('fs'), box = document.getElementById('box');
  var C = DECO.customers().map(function (c) {
    var Q = DECO.custQuotes(c), st = Q.length ? (Q[0].status || '상담') : '견적 전';
    var won = Q.filter(function (q) { return ['계약', '시공', '완료'].indexOf(q.status) >= 0; }).reduce(function (s, q) { return s + ((q.totals && q.totals.total) || 0); }, 0);
    var due = Q.filter(function (q) { return ['계약', '시공', '완료'].indexOf(q.status) >= 0; }).reduce(function (s, q) { return s + Math.max(0, ((q.totals && q.totals.total) || 0) - (q.pays || []).reduce(function (a, p) { return a + (+p.amt || 0); }, 0)); }, 0);
    var last = Math.max(c.touched || 0, c.updated || 0, Q.length ? Q[0].updated || 0 : 0, c.logs && c.logs.length ? new Date(c.logs[c.logs.length - 1].date + 'T12:00').getTime() || 0 : 0);
    var nc = Q.filter(function (q) { return ['계약', '시공', '완료'].indexOf(q.status) >= 0; }).length, nr = c.name ? DECO.customers().filter(function (y) { return y.id !== c.id && y.ref && String(y.ref).indexOf(c.name) === 0; }).length : 0;
    return { nc: nc, nr: nr, c: c, n: Q.length, st: st, won: won, due: due, ago: last ? Math.floor((Date.now() - last) / 864e5) : 999 };
  });
  // ── 주소에서 시·군 / 구(없으면 읍·면·동) 뽑기 ──
  function region(a) { var T = String(a || '').replace(/[(),]/g, ' ').split(/\s+/).filter(Boolean), si = '', gu = '', i = 0;
    for (; i < T.length; i++) { var t = T[i];
      if (/(특별시|광역시|특별자치시)$/.test(t) || /^(서울|부산|대구|인천|광주|대전|울산|세종)$/.test(t)) { si = t.replace(/(특별시|광역시|특별자치시)$/, ''); i++; break; }
      if (/(도|특별자치도)$/.test(t) && !/(시|군)$/.test(t)) continue;
      if (/[가-힣](시|군)$/.test(t)) { si = t; i++; break; } }
    if (!si) return { si: '', gu: '' };
    for (; i < T.length && i < 5; i++) { if (/[가-힣]구$/.test(T[i])) { gu = T[i]; break; } if (!gu && /[가-힣](읍|면|동|가)$/.test(T[i]) && !/[0-9]/.test(T[i])) { gu = T[i]; break; } }
    return { si: si, gu: gu }; }
  C.forEach(function (x) { var r = region(x.c.addr); x.si = r.si || '주소 없음·모름'; x.gu = r.gu || '(구·동 모름)'; x.cd = x.c.created || x.c.updated || 0; x.ld = Date.now() - x.ago * 864e5; });
  var $f = function (id) { return document.getElementById(id); };
  function siOpts() { var N = {}; C.forEach(function (x) { N[x.si] = (N[x.si] || 0) + 1; }); var v = $f('fSi').value;
    $f('fSi').innerHTML = '<option value="">전체 지역 (' + C.length + '명)</option>' + Object.keys(N).sort(function (a, b) { return N[b] - N[a]; }).map(function (k) { return '<option value="' + E(k) + '">' + E(k) + ' (' + N[k] + '명)</option>'; }).join(''); $f('fSi').value = v; guOpts(); }
  function guOpts() { var s = $f('fSi').value, N = {}, v = $f('fGu').value; C.forEach(function (x) { if (s && x.si !== s) return; N[x.gu] = (N[x.gu] || 0) + 1; });
    $f('fGu').innerHTML = '<option value="">' + (s ? s + ' 전체' : '구·동 전체') + '</option>' + Object.keys(N).sort().map(function (k) { return '<option value="' + E(k) + '">' + E(k) + ' (' + N[k] + '명)</option>'; }).join(''); $f('fGu').value = N[v] ? v : ''; $f('fGu').disabled = !s; }
  function period() { var p = $f('fPe').value, n = new Date(), y = n.getFullYear(), m = n.getMonth(); $f('fCu').hidden = p !== 'cu';
    if (p === 'm0') return [new Date(y, m, 1), new Date(y, m + 1, 1)]; if (p === 'm1') return [new Date(y, m - 1, 1), new Date(y, m, 1)]; if (p === 'm3') return [new Date(y, m - 2, 1), new Date(y, m + 1, 1)];
    if (p === 'y0') return [new Date(y, 0, 1), new Date(y + 1, 0, 1)]; if (p === 'y1') return [new Date(y - 1, 0, 1), new Date(y, 0, 1)];
    if (p === 'cu') { var a = $f('fD1').value, b = $f('fD2').value; if (!a && !b) return null; return [a ? new Date(a + 'T00:00') : new Date(0), b ? new Date(new Date(b + 'T00:00').getTime() + 864e5) : new Date(9e15)]; } return null; }
  function anyF() { return $f('fSi').value || $f('fGu').value || $f('fPe').value; }
  function hdr(x) { if ($f('fVw').value === 'reg') return x.si === '주소 없음·모름' ? '📍 주소 없음·모름' : '📍 ' + x.si + ' ' + x.gu; var d = new Date($f('fBy').value === 'l' ? x.ld : x.cd); return '📅 ' + (x.cd || $f('fBy').value === 'l' ? d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월' : '날짜 모름') + ($f('fBy').value === 'l' ? ' 연락' : ' 등록'); }
  siOpts();
  fs.innerHTML = '<option value="">전체 상태</option><option value="_call">☎ 연락할 고객 (상담·실측, 3일 넘게 연락 없음)</option><option value="_due">💰 받을 돈 남은 고객</option>' + ['견적 전'].concat(DECO.STATUS).map(function (s) { return '<option>' + s + '</option>'; }).join('');
  var cnt = function (s) { return C.filter(function (x) { return x.st === s; }).length; };
  // 진행 상태 카테고리 버튼 (누르면 그 고객만)
  var CAT = [['', '전체', C.length, '#3B2F2A'], ['견적 전', '견적 전', cnt('견적 전'), '#8A7F76'], ['상담', '상담', cnt('상담'), '#2F6DB5'], ['실측', '실측', cnt('실측'), '#B26B12'], ['계약', '계약', cnt('계약'), '#2E6A4E'],
    ['시공', '시공 중', cnt('시공'), '#C4572A'], ['완료', '시공 완료', cnt('완료'), '#1F5136'], ['보류', '보류', cnt('보류'), '#6B6F76'],
    ['_call', '☎ 연락할 고객', C.filter(function (x) { return (x.st === '상담' || x.st === '실측' || x.st === '견적 전') && x.ago >= 3; }).length, '#9B3A22'], ['_due', '💰 받을 돈', C.filter(function (x) { return x.due; }).length, '#8A5A12']];
  document.getElementById('sum').innerHTML = CAT.map(function (c) { return '<button type="button" data-st="' + E(c[0]) + '" style="--cc:' + c[3] + '"' + (c[2] ? '' : ' class="zero"') + '><span>' + E(c[1]) + '</span><b>' + c[2] + '명</b></button>'; }).join('');
  function catMark() { [].forEach.call(document.querySelectorAll('#sum [data-st]'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.st === fs.value)); }); }
  document.getElementById('sum').addEventListener('click', function (e) { var b = e.target.closest('[data-st]'); if (!b) return; fs.value = b.dataset.st; fs.dispatchEvent(new Event('change')); });
  function draw() {
    var k = qs.value.trim(), kd = k.replace(/\D/g, '');
    var L = C.filter(function (x) { var c = x.c; if (fs.value === '_call') { if (!((x.st === '상담' || x.st === '실측' || x.st === '견적 전') && x.ago >= 3)) return false; } else if (fs.value === '_due') { if (!x.due) return false; } else if (fs.value && x.st !== fs.value) return false; if (!k) return true;
      return [c.name, c.addr].join(' ').indexOf(k) >= 0 || (kd.length >= 3 && String(c.phone).replace(/\D/g, '').indexOf(kd) >= 0); });
    if (fs.value === '_call') L.sort(function (a, b) { return a.ago - b.ago; }); if (fs.value === '_due') L.sort(function (a, b) { return b.due - a.due; });
    catMark(); var si = $f('fSi').value, gu = $f('fGu').value, pr = period(), by = $f('fBy').value, vw = $f('fVw').value;
    L = L.filter(function (x) { if (si && x.si !== si) return false; if (gu && x.gu !== gu) return false; if (pr) { var t = by === 'l' ? (x.ago < 999 ? x.ld : 0) : x.cd; if (!(t >= pr[0].getTime() && t < pr[1].getTime())) return false; } return true; });
    if (vw === 'reg') L.sort(function (a, b) { return (a.si === '주소 없음·모름') - (b.si === '주소 없음·모름') || a.si.localeCompare(b.si) || a.gu.localeCompare(b.gu) || String(a.c.name || '').localeCompare(String(b.c.name || '')); });
    if (vw === 'mon') L.sort(function (a, b) { return by === 'l' ? a.ago - b.ago : b.cd - a.cd; });
    $f('fN').textContent = (k || fs.value || anyF()) ? '찾은 고객 ' + L.length + '명' : '';
    var HC = {}; if (vw) L.forEach(function (x) { var h = hdr(x); HC[h] = (HC[h] || 0) + 1; }); var lastH = null;
    if (!L.length) { box.innerHTML = '<div class="empty">' + (k || fs.value || anyF() ? '찾는 고객이 없습니다.' : '아직 고객이 없습니다. 견적을 저장하거나 「+ 고객 등록」을 누르세요.') + '</div>'; return; }
    box.innerHTML = L.map(function (x) { var c = x.c, hd = ''; if (vw) { var h = hdr(x); if (h !== lastH) { lastH = h; hd = '<h2 style="font-size:19px;margin:16px 0 6px;padding:6px 10px;background:#3B2F2A;color:#fff;border-radius:8px">' + E(h) + ' <small style="font-weight:400">(' + HC[h] + '명)</small></h2>'; } }
      return hd + '<a class="c" href="customer.html?id=' + encodeURIComponent(c.id) + '"><div><h3>' + E(c.name || '이름 없음') + ' 님<span class="tag">' + E(x.st) + '</span>' + (x.nc >= 2 ? '<span class="tag" style="background:#FFF1D6;color:#8A5A12;border-color:#E9C27A">🏅 단골 ' + x.nc + '번</span>' : '') + (x.nr ? '<span class="tag" style="background:#E8F3EC;color:#2E6A4E;border-color:#9BC7AE">🤝 소개 ' + x.nr + '명</span>' : '') + '</h3>' +
        '<div class="m">' + E(c.phone || '전화 없음') + (c.addr ? ' · ' + E(c.addr) : '') + '</div>' +
        '<div class="m">견적 ' + x.n + '건' + (c.source ? ' · ' + E(c.source) : '') + (c.logs && c.logs.length ? ' · 최근 상담 ' + E(c.logs[c.logs.length - 1].date) : '') + (x.ago < 999 ? ' · ' + (x.ago ? x.ago + '일 전 연락' : '오늘 연락') : '') + (x.due ? ' · <b style="color:#b5462f">받을 돈 ' + DECO.won(x.due) + '</b>' : '') + '</div></div>' +
        '<div class="r">' + (x.won ? '<b>' + DECO.won(x.won) + '</b><span class="m">계약 금액</span>' : '') + '</div></a>';
    }).join('');
  }
  // 🎁 소개해 주신 분: 소개 인원·계약 인원·감사 카톡·혜택 기록
