<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공사 계약서 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
@page{size:A4;margin:12mm}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools label{display:flex;flex-direction:column;font-size:14px;gap:3px}
.tools input{font-size:16px;padding:7px}
.sheet{background:#fff;max-width:210mm;margin:0 auto;padding:14mm 13mm;border:1px solid var(--line,#ddd);font-size:13.5px;line-height:1.6;color:#111}
.sheet h1{text-align:center;font-size:28px;font-weight:800;letter-spacing:.4em;margin:0 0 14px;padding-left:.4em}
table{border-collapse:collapse;width:100%;margin-bottom:10px}
th,td{border:1px solid #555;padding:6px 8px;vertical-align:middle;text-align:left}
th{background:#f1eee7;font-weight:500;white-space:nowrap;width:90px}
ol.cl{padding-left:20px;margin:6px 0 12px}
ol.cl li{margin:3px 0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sg>div{border:1px solid #555;padding:8px}
.sg b{display:block;margin-bottom:4px}
.pad{-webkit-user-select:none;user-select:none;position:relative;border:1px dashed #b9a98f;background:#fffdf8;height:130px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block}
.pad span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b9a98f;pointer-events:none;font-size:15px}
.pad img{width:100%;height:100%;object-fit:contain;display:block}
.seal{height:130px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#b5462f}
.note{font-size:12px;color:#555;margin-top:10px}
@media print{body.app{background:#fff}body.app::before{display:none}.page{padding:0;max-width:none}.tools,.topnav,.noprint{display:none!important}.sheet{border:0;padding:0;max-width:none}.pad{border:0;background:none}.pad span{display:none}}
@media (max-width:640px){.sheet{padding:16px 12px}.sg{grid-template-columns:1fr}}
</style>
</head>
<body class="app">
<div class="page" style="max-width:860px">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <div class="tools">
    <label>착공일<input type="date" id="d1"></label>
    <label>완공 예정일<input type="date" id="d2"></label>
    <label>계약금(원)<input type="number" id="dep" inputmode="numeric" step="10000"></label>
    <button class="btn2 pri" type="button" id="save">서명 저장</button>
    <button class="btn2" type="button" id="prt">인쇄 · PDF</button>
    <p class="msg" id="msg" role="status" style="flex:1 1 100%;margin:0"></p>
  </div>
  <div class="sheet" id="sheet"></div>
</div>
<script src="common.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, E = DECO.esc, W = DECO.won, s = DECO.settings();
  var id = new URLSearchParams(location.search).get('id'), q = id ? DECO.getQuote(id) : null;
  if (!q) { $('sheet').innerHTML = '<p>견적을 찾을 수 없습니다. 견적 목록에서 「계약서·서명」을 눌러 주세요.</p>'; return; }
  var c = q.cust || {}, t = q.totals || {}, o = DECO.orders().filter(function (x) { return x.quoteId === q.id; })[0], sg = q.sign || {};
  $('d1').value = sg.d1 || (o && o.workDate) || ''; $('d2').value = sg.d2 || (o && o.workDate) || '';
  $('dep').value = sg.dep != null ? sg.dep : (q.deposit != null ? q.deposit : (+s.deposit || 0));
  function items() { var L = []; if (q.pkg && q.pkg !== 'none') L.push(E(q.pkgName || '패키지') + (q.pkgDesc ? ' (' + E(q.pkgDesc) + ')' : ''));
    (q.items || []).forEach(function (i) { L.push(E(i.name) + (i.opt ? ' (' + E(i.opt) + ')' : '') + ' × ' + E(i.qty)); });
    (q.etc || []).forEach(function (r) { if (r.label) L.push(E(r.label)); }); return L.length ? L.join('<br>') : '견적서 내용과 같음'; }
  function d(v) { return v ? v.replace(/-/g, '. ') + '.' : '      .    .    .'; }
  function draw() { var dep = Math.max(0, +$('dep').value || 0), rest = Math.max(0, (t.total || 0) - dep);
    $('sheet').innerHTML = '<h1>공사 계약서</h1>' +
      '<table><tr><th>공사명</th><td>간접조명 · 실링팬 시공 공사 (견적 ' + E(q.no) + ')</td></tr><tr><th>공사 장소</th><td>' + E(c.addr || '') + '</td></tr>' +
      '<tr><th>공사 기간</th><td>' + d($('d1').value) + ' ~ ' + d($('d2').value) + '</td></tr>' +
      '<tr><th>공사 내용</th><td>' + items() + '</td></tr>' +
      '<tr><th>계약 금액</th><td><b>' + W(t.total) + '</b> (공급가액 ' + W(t.supply) + ' · 부가세 ' + W(t.vat) + ')</td></tr>' +
      '<tr><th>대금 지급</th><td>계약금 ' + W(dep) + ' (계약 시) · 잔금 ' + W(rest) + ' (시공 완료 후)' + (s.bank ? '<br>입금 계좌: ' + E(s.bank) : '') + '</td></tr></table>' +
      '<ol class="cl"><li>시공자는 견적서와 이 계약서의 내용대로 성실히 시공합니다.</li>' +
      '<li>' + E(s.terms) + '</li>' +
      '<li>' + E(s.refund) + '</li>' +
      '<li>시공 후 1년 동안 시공 부위의 하자는 무상으로 점검·보수합니다. 다만 사용자 부주의, 천재지변, 제품 자체 고장(제조사 보증)은 제외합니다.</li>' +
      '<li>공사 범위가 늘거나 줄면 양쪽이 협의하여 금액을 다시 정합니다.</li>' +
      '<li>이 계약서에 없는 사항은 양쪽이 협의하여 정합니다.</li></ol>' +
      '<p style="text-align:center;margin:10px 0">위와 같이 계약하고 각 1부씩 보관합니다. &nbsp; ' + d(sg.at ? DECO.ymd(new Date(sg.at)) : DECO.today()) + '</p>' +
      '<div class="sg"><div><b>발주자 (고객)</b>성명: ' + E(c.name || '') + '<br>연락처: ' + E(c.phone || '') + '<div class="pad" id="pad">' + (sg.cust ? '<img src="' + sg.cust + '" alt="고객 서명">' : '<canvas id="cv"></canvas><span>여기에 손가락으로 서명</span>') + '</div>' +
      '<div class="noprint" style="margin-top:6px">' + (sg.cust ? '<button class="btn2" type="button" id="resign">서명 다시 받기</button>' : '<button class="btn2" type="button" id="clr">서명 지우기</button>') + '</div></div>' +
      '<div><b>시공자</b>' + E(s.bizName || s.company) + '<br>대표: ' + E(s.ceo || '') + ' · ' + E(s.phone || '') + '<br>사업자번호: ' + E(s.bizno || '') + '<br>주소: ' + E(s.addr || '') + '<div class="seal">' + E(s.company) + ' (인)</div></div></div>' +
      '<p class="note">※ 이 계약서는 소규모 시공용 참고 양식입니다. 금액이 크거나 특별한 조건이 있으면 전문가 확인을 받으세요.</p>';
    pad(); }
  var ink = false;
  function pad() { var cv = $('cv'); if (cv) { var r = cv.getBoundingClientRect(), x = cv.getContext('2d'); cv.width = r.width * 2; cv.height = r.height * 2; x.scale(2, 2); x.lineWidth = 2.6; x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#111'; ink = false;
      var down = false; function p(e) { var b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
      cv.onpointerdown = function (e) { down = true; cv.setPointerCapture(e.pointerId); var a = p(e); x.beginPath(); x.moveTo(a[0], a[1]); cv.nextSibling && (cv.nextSibling.style.display = 'none'); };
      cv.onpointermove = function (e) { if (!down) return; var a = p(e); x.lineTo(a[0], a[1]); x.stroke(); ink = true; };
      cv.onpointerup = cv.onpointercancel = function () { down = false; }; }
    if ($('clr')) $('clr').onclick = function () { draw(); };
    if ($('resign')) $('resign').onclick = function () { delete sg.cust; draw(); }; }
  ['d1', 'd2', 'dep'].forEach(function (k) { $(k).addEventListener('change', draw); });
  $('save').onclick = function () { var cv = $('cv'), m = $('msg');
    if (cv && ink) { var o2 = document.createElement('canvas'); o2.width = 480; o2.height = Math.round(480 * cv.height / cv.width); o2.getContext('2d').drawImage(cv, 0, 0, o2.width, o2.height); sg.cust = o2.toDataURL('image/png'); }
    if (!sg.cust) { m.className = 'msg bad'; m.textContent = '고객 서명이 없습니다. 서명 칸에 손가락으로 서명을 받아 주세요.'; return; }
    sg.d1 = $('d1').value; sg.d2 = $('d2').value; sg.dep = Math.max(0, +$('dep').value || 0); sg.at = sg.at || Date.now();
    var all = DECO.getQuote(q.id); all.sign = sg; if (['상담', '실측', '보류'].indexOf(all.status || '상담') >= 0) all.status = '계약'; q = DECO.saveQuote(all) || q;
    m.className = 'msg'; m.textContent = '서명을 저장했습니다. 견적 상태를 「계약」으로 바꿨습니다. 「인쇄 · PDF」로 고객에게 한 부 드리세요.'; draw(); };
  $('prt').onclick = function () { window.print(); };
  draw();
})();
</script>
</body>
</html>
