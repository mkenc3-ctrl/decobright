<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>견적서 · 데코브라이트</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="데코브라이트 견적서">
<meta property="og:description" content="간접조명·실링팬 견적서입니다. 눌러서 확인해 주세요.">
<meta property="og:image" content="https://mkenc3-ctrl.github.io/decobright/img/m/ka-warm.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="icon" href="icons/icon.svg">
<style>
:root{--ink:#221C18;--muted:#7A6E66;--line:#E6D9C6;--bd:#CDBBA3;--pri:#3B2F2A;--paper:#FBF6EE;--warm:#E0952B;--warm-s:#FCEBD2;--acc:#B5541C;--ok:#2E6A4E;--no:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:17px;line-height:1.55}
.w{max-width:620px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.hd{background:#2A211C;color:#fff;border-radius:14px 14px 0 0;padding:18px}
.hd small{color:#F3C98A;font-weight:800;font-size:16px}
.hd h1{margin:4px 0 0;font-size:30px;letter-spacing:.2em}
.hd p{margin:4px 0 0;color:#e9dccb;font-size:15px}
.bd{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:16px;margin-bottom:14px}
.to{font-size:22px;font-weight:800;margin:0 0 8px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:16px;margin-bottom:6px}
.kv b{color:var(--muted);font-weight:700}
h2{font-size:17px;background:var(--pri);color:#fff;padding:8px 12px;border-radius:8px;margin:16px 0 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:16px}
.row:nth-child(even){background:#F6EBDD}
.row span{min-width:0}.row small{display:block;color:var(--muted);font-size:14px}
.row b{white-space:nowrap}
.tot{margin-top:14px}
.tot .row{background:#fff!important;border:0;padding:4px 12px}
.tot .big{background:var(--warm-s)!important;border-radius:10px;padding:12px;margin-top:6px;font-size:20px;font-weight:800}
.tot .big b{color:var(--acc);font-size:24px}
.pic img{width:100%;border-radius:10px;display:block;margin-top:8px}
.note{font-size:15px;color:#4A403A;margin:12px 0 0}
.ask{background:#fff;border:2px solid var(--warm);border-radius:14px;padding:16px}
.ask h3{margin:0 0 6px;font-size:20px}
.ask label{display:block;font-weight:700;margin:10px 0 0}
.ask input{display:block;width:100%;font:inherit;font-size:17px;height:50px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;margin-top:4px}
.big2{display:flex;align-items:center;justify-content:center;width:100%;height:62px;font:inherit;font-size:20px;font-weight:800;border-radius:14px;border:0;cursor:pointer;margin-top:10px;text-decoration:none}
.y{background:var(--warm);color:#1d1714}.g{background:#fff;border:2px solid var(--pri)!important;color:var(--pri)}
.msg{min-height:24px;font-weight:700;margin:10px 0 0}.msg.ok{color:var(--ok)}.msg.bad{color:var(--no)}
.done{background:#E8F3EC;border:2px solid var(--ok);border-radius:14px;padding:16px;font-size:18px;font-weight:700}
.row.off span,.row.off b{text-decoration:line-through;color:#9a8f86}
.ck{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:15px;font-weight:700;color:var(--acc);cursor:pointer}
.ck input{width:24px;height:24px}
.want{background:#FCEBD2;border-radius:10px;padding:12px;margin-top:8px;font-size:17px;font-weight:700}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel2 select{font:inherit;font-size:18px;padding:12px;border:2px solid #d8cfc6;border-radius:10px;background:#fff;width:100%}
.exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.exs a{display:block;text-decoration:none;color:inherit;font-size:14px;font-weight:600}
.exs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;margin-bottom:4px}
.err{background:#fff;border:2px solid var(--no);border-radius:14px;padding:16px;font-size:18px}
</style>
</head>
<body>
<div class="w">
  <div id="doc" hidden>
    <div class="hd"><small id="co"></small><h1>견적서</h1><p id="no"></p></div>
    <div class="bd">
      <p class="to" id="to"></p>
      <div class="kv" id="kv"></div>
      <div id="secs"></div>
      <div class="tot" id="tot"></div>
      <div class="want" id="want" hidden></div>
      <div class="pic" id="pic" hidden><h2>조명 배치 예상 모습</h2><img id="picI" alt="조명 배치 예상 모습"></div>
      <p class="note" id="note"></p>
      <div id="exB" hidden><h2>비슷하게 시공한 집</h2><div class="exs" id="exs"></div><p style="margin:8px 0 0;font-size:15px"><a href="house.html" id="exAll" style="color:var(--acc);font-weight:700">🏠 e모델하우스에서 시공 사진 더 보기 ›</a></p></div>
    </div>
    <div class="ask" id="ask">
      <h3>이 견적, 어떠세요?</h3>
      <p style="margin:0;color:var(--muted);font-size:15px">아래 단추를 누르면 담당자에게 바로 전해집니다. 실측 날짜를 잡아 연락드립니다.</p>
      <b style="display:block;margin-top:12px;font-size:17px">📅 실측 오면 좋은 날 <small style="font-weight:400">(선택)</small></b>
      <div class="sel2"><select id="mdD" aria-label="실측 희망 날짜"></select><select id="mdT" aria-label="실측 희망 시간"><option value="">시간</option><option>오전</option><option>오후</option><option>저녁</option><option>아무 때나</option></select></div>
      <label>전화 받기 편한 시간 <small style="font-weight:400">(선택)</small><input id="tm" maxlength="40" placeholder="예: 평일 저녁 6시 이후"></label>
      <label>남길 말씀 <small style="font-weight:400">(선택)</small><input id="say" maxlength="100" placeholder="예: 다운라이트 2개 빼고 싶어요"></label>
      <button type="button" class="big2 y" data-a="ok">✅ 이 견적으로 진행할게요</button>
      <button type="button" class="big2 g" data-a="ask">🤔 상담이 더 필요해요</button>
      <a class="big2 g" id="tel" href="#" style="display:flex">📞 전화로 묻기</a>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <div class="done" id="done" hidden></div>
  </div>
  <div class="err" id="bad" hidden></div>
</div>
<script src="common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
