<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하자·고장 접수 · 데코브라이트</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="icon" href="icons/icon.svg">
<style>
:root{--ink:#221C18;--muted:#7A6E66;--line:#E6D9C6;--bd:#CDBBA3;--pri:#3B2F2A;--paper:#FBF6EE;--warm:#E0952B;--warm-s:#FCEBD2;--ok:#2E6A4E;--no:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:17px;line-height:1.55}
.w{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.hd{background:#1d1714;color:#fbf2e4;border-radius:14px;padding:16px;margin-bottom:12px}
.hd h1{margin:0 0 6px;font-size:23px}
.hd p{margin:2px 0;font-size:16px;color:#e9dccb}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.f{display:block;font-weight:700;margin-bottom:10px}
label.f input{display:block;width:100%;margin-top:4px;font:inherit;font-size:18px;height:52px;border:1px solid var(--bd);border-radius:10px;padding:0 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.seg button{flex:1 1 30%;font:inherit;font-size:17px;font-weight:700;height:50px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:64px;font:inherit;font-size:21px;font-weight:800;border-radius:14px;border:0;cursor:pointer;margin-bottom:10px}
.big.a{background:var(--warm);color:#1d1714}
.big.b{background:#fff;border:2px solid var(--pri);color:var(--pri)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.msg{min-height:26px;font-weight:700;margin:4px 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--no)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.err{background:#fff;border:2px solid var(--no);border-radius:14px;padding:16px;font-size:18px}
.ck2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 10px}
.ck2 button{font:inherit;font-size:16px;font-weight:700;min-height:52px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer;padding:6px}
.ck2 button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
textarea,select{display:block;width:100%;margin-top:4px;font:inherit;font-size:18px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fff}
</style>
</head>
<body>
<div class="w">
  <div class="hd"><h1>🛠 하자·고장 접수</h1><p id="hInfo">불러오는 중…</p></div>
  <div id="main" hidden>
    <div class="card">
      <b>어디가 불편하세요? <small style="font-weight:400;color:var(--muted)">(여러 개 고를 수 있습니다)</small></b>
      <div class="ck2" id="kd"></div>
      <label class="f">자세한 내용 <small style="font-weight:400;color:var(--muted)">(선택)</small><textarea id="say" rows="3" maxlength="300" placeholder="예: 거실 간접등 한쪽이 안 켜져요"></textarea></label>
      <label class="f">방문 오면 좋은 날 <small style="font-weight:400;color:var(--muted)">(선택)</small><select id="md"></select></label>
      <label class="f">연락처<input id="tel" inputmode="tel" placeholder="010-0000-0000"></label>
      <label class="big b" for="ph">📸 사진 붙이기 <small id="phN" style="font-size:15px">(최대 3장)</small></label><input id="ph" type="file" accept="image/*" multiple>
      <button type="button" class="big a" id="go">📨 접수하기</button>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <p style="font-size:14px;color:var(--muted)">접수하시면 담당자가 확인하고 연락드려 방문 날짜를 잡습니다. 사진과 연락처는 하자 처리에만 씁니다.</p>
  </div>
  <div class="card" id="ok" hidden style="border:2px solid var(--ok);font-size:18px;font-weight:700"></div>
  <div class="err" id="bad" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, P = new URLSearchParams(location.search), oid = P.get('o') || '', key = P.get('k') || '';
  var C = null, ord = null, FL = [];
  function bad(t) { $('main').hidden = true; $('bad').hidden = false; $('bad').textContent = t; $('hInfo').textContent = '데코브라이트'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  $('kd').innerHTML = ['💡 조명이 안 켜져요', '✨ 조명이 깜빡여요', '🌀 실링팬 소리·흔들림', '🎛 리모컨·스위치', '🧱 천장 마감·금', '📝 기타'].map(function (k) { return '<button type="button" aria-pressed="false">' + k + '</button>'; }).join('');
  $('kd').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); });
  var o = '<option value="">날짜 고르기</option>', d = new Date(); for (var i = 1; i <= 14; i++) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i); o += '<option value="' + x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0') + '">' + (x.getMonth() + 1) + '/' + x.getDate() + ' (' + '일월화수목금토'[x.getDay()] + ')</option>'; } $('md').innerHTML = o;
  $('ph').onchange = function () { FL = FL.concat([].slice.call(this.files || []).filter(function (f) { return /^image\//.test(f.type); })).slice(0, 3); this.value = ''; $('phN').textContent = FL.length ? '(' + FL.length + '장 붙임)' : '(최대 3장)'; };
  if (!window.supabase || !oid || !key) return bad(!window.supabase ? '인터넷 연결을 확인하고 다시 열어 주세요.' : '주소가 잘못되었습니다. 받으신 카톡의 주소를 다시 눌러 주세요.');
  C = window.supabase.createClient('https://dypvqgaayumrhaiphatu.supabase.co', 'sb_publishable_5-LUZwZQ3VwBxDKDA_nJpw_ddF6QKdE', { auth: { persistSession: false } });
  C.from('records').select('data').eq('coll', 'orders').eq('id', oid).maybeSingle().then(function (r) { var dd = r.data && r.data.data;
    if (r.error) return bad('서버에 연결하지 못했습니다. 잠시 뒤 다시 열어 주세요.');
    if (!dd || dd._del || !dd.upk || dd.upk !== key) return bad('접수 주소가 맞지 않습니다. 전화로 연락 주세요.');
    ord = dd; $('hInfo').innerHTML = (dd.name ? esc(dd.name) + ' 님 · ' : '') + '📍 ' + esc(dd.addr || '시공 현장'); $('tel').value = dd.phone || ''; $('main').hidden = false; }, function () { bad('서버에 연결하지 못했습니다. 인터넷을 확인해 주세요.'); });
  function shrink(f) { return new Promise(function (ok, no) { var u = URL.createObjectURL(f), im = new Image();
    im.onload = function () { var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(function (b) { b ? ok(b) : no(new Error('변환 실패')); }, 'image/jpeg', 0.85); };
    im.onerror = function () { URL.revokeObjectURL(u); no(new Error('사진을 열 수 없습니다')); }; im.src = u; }); }
  $('go').onclick = function () { var m = $('msg'), K = [].filter.call($('kd').children, function (b) { return b.getAttribute('aria-pressed') === 'true'; }).map(function (b) { return b.textContent.replace(/^\S+\s/, ''); }), say = $('say').value.trim(), tel = $('tel').value.trim();
    if (!K.length && !say) { m.className = 'msg bad'; m.textContent = '불편한 곳을 하나 고르거나 내용을 적어 주세요.'; return; }
    if (tel.replace(/\D/g, '').length < 9) { m.className = 'msg bad'; m.textContent = '연락드릴 번호를 적어 주세요.'; $('tel').focus(); return; }
    var btn = this; btn.disabled = true; m.className = 'msg'; m.textContent = '접수하는 중… 화면을 닫지 마세요'; var now = Date.now(), id = 'a' + now.toString(36) + Math.random().toString(36).slice(2, 5), PH = [];
    FL.reduce(function (p, f) { return p.then(function () { return shrink(f).then(function (b) { var pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), path = 'p/' + pid + '.jpg';
      return C.storage.from('photos').upload(path, b, { upsert: true, contentType: 'image/jpeg' }).then(function (x) { if (x.error) throw x.error;
        return C.from('records').upsert({ coll: 'photos', id: pid, data: { id: pid, job: ord.quoteId || '', stage: '하자·보수', memo: '[하자 접수] ' + K.join(', '), taken: f.lastModified || now, added: Date.now(), by: '손님 ' + (ord.name || ''), order: oid, path: path } }, { onConflict: 'coll,id' }); })
        .then(function (x) { if (x.error) throw x.error; PH.push(pid); }); }); }); }, Promise.resolve())
    .then(function () { return C.from('records').upsert({ coll: 'asreq', id: id, data: { id: id, oid: oid, custId: ord.custId || '', name: ord.name || '', addr: ord.addr || '', phone: tel, kinds: K, say: say, md: $('md').value, ph: PH, at: now } }, { onConflict: 'coll,id' }); })
    .then(function (x) { if (x && x.error) throw x.error; C.functions.invoke('notify', { body: { coll: 'asreq', id: id } }).catch(function () {}); $('main').hidden = true; $('ok').hidden = false; $('ok').textContent = '✔ 접수했습니다. 확인하고 ' + tel + ' 로 연락드리겠습니다. 불편을 드려 죄송합니다.'; },
      function () { btn.disabled = false; m.className = 'msg bad'; m.textContent = '접수하지 못했습니다. 인터넷을 확인하거나 전화로 연락 주세요.'; }); };
})();
</script>
</body>
</html>
