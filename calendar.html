<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시공 달력 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
.mh{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mh h2{font-family:'Noto Sans KR',sans-serif;font-weight:800;font-size:26px;margin:0 8px;min-width:150px;text-align:center}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted);margin-bottom:8px}
.lg i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff}
.cal .wd{font-size:14px;text-align:center;padding:4px 0;background:var(--line2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:500}
.cal .wd:first-child,.cal .day.sun .n{color:var(--no)}
.cal .wd:nth-child(7),.cal .day.sat .n{color:#2456a6}
.day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;cursor:pointer;background:#fff;font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:hover{background:var(--pri-s)}
.day.out{background:#faf8f3;opacity:.55}
.day.today .n{background:var(--warm);color:#2a1a04;padding:0 6px}
.day.sel{outline:3px solid var(--pri);outline-offset:-3px}
.day .n{font-size:15px;font-weight:700;align-self:flex-start}
.ev{font-size:12.5px;line-height:1.3;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:var(--pri)}
.ev.k1{background:#b26b12}.ev.k2{background:#2E6A4E}.ev.k3{background:#6b5a8e}.ev.k4{background:#9B3A22}.ev.k5{background:#5d6168}
.ev.done{opacity:.5;text-decoration:line-through}
@media (max-width:640px){.day{min-height:62px}.ev{font-size:0;height:7px;padding:0}.mh h2{font-size:21px;min-width:120px}}
.panel{margin-top:16px}
.panel h3{font-size:20px;margin:0 0 8px}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--pri);padding:10px 12px;margin-bottom:5px;color:var(--ink);text-decoration:none;cursor:pointer;font:inherit;width:100%;text-align:left}
.it small{display:block;color:var(--muted);font-size:14px}
.it.k1{border-left-color:#b26b12}.it.k2{border-left-color:#2E6A4E}.it.k3{border-left-color:#6b5a8e}.it.k4{border-left-color:#9B3A22}.it.k5{border-left-color:#5d6168}
.fl select{font:inherit;font-size:17px;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;background:#fff}
</style>
</head>
<body class="app">
<div class="page">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">시공 달력</h1>
  <p class="sub">시공(작업 지시서)과 실측·상담 일정을 한눈에 봅니다. 날짜를 누르면 그날 일정과 「일정 추가」가 아래에 나옵니다.</p>
  <div class="mh">
    <button class="btn2" type="button" id="prev" aria-label="이전 달">◀ 이전 달</button>
    <h2 id="mt"></h2>
    <button class="btn2" type="button" id="next" aria-label="다음 달">다음 달 ▶</button>
    <button class="btn2" type="button" id="tod">오늘</button>
  </div>
  <div class="lg" id="lg"></div>
  <div class="cal" id="cal"></div>
  <section class="panel" id="panel">
    <h3 id="pt"></h3>
    <div id="plist"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
      <a class="btn2" id="mkOrder" href="order.html">이 날 시공 지시서 만들기</a>
    </div>
    <form class="card" id="f" autocomplete="off">
      <h3 id="ft" style="font-size:18px">일정 추가</h3>
      <div class="grid2">
        <label class="fl">종류<select name="kind" id="kind"></select></label>
        <label class="fl">시각<input name="time" type="time"></label>
        <label class="fl">날짜<input name="date" type="date" required></label>
        <label class="fl">고객<select name="custId" id="cust"><option value="">고객 없음</option></select></label>
        <label class="fl" style="grid-column:1/-1"><span class="need">내용</span><input name="title" required placeholder="예: 34평 거실 실측, 줄자·사진"></label>
        <label class="fl"><span>완료</span><select name="done"><option value="">아직</option><option value="1">끝남</option></select></label>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn2 pri" type="submit">저장</button>
        <button class="btn2" type="button" id="newE" hidden>새 일정으로</button>
        <button class="btn2 no" type="button" id="delE" hidden>이 일정 지우기</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </form>
  </section>
</div>
<script src="common.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, E = DECO.esc, P = new URLSearchParams(location.search), f = $('f');
  var sel = P.get('d') || DECO.today(), view = new Date(sel + 'T00:00'), editing = null;
  var CU = DECO.customers(), cname = function (id) { var c = CU.filter(function (x) { return x.id === id; })[0]; return c ? c.name : ''; };
  $('kind').innerHTML = DECO.KINDS.map(function (k) { return '<option>' + k + '</option>'; }).join('');
  $('cust').innerHTML += CU.map(function (c) { return '<option value="' + E(c.id) + '">' + E(c.name) + (c.phone ? ' (' + E(c.phone) + ')' : '') + '</option>'; }).join('');
  $('lg').innerHTML = '<span><i style="background:var(--pri)"></i>시공</span>' + DECO.KINDS.map(function (k, i) { return '<span><i class="ev k' + (i + 1) + '" style="padding:0"></i>' + k + '</span>'; }).join('');
  function items(d) {
    var a = DECO.orders().filter(function (o) { return o.workDate === d; }).map(function (o) {
      return { k: 0, time: o.workTime || '', t: '시공 ' + (o.name || ''), s: (o.addr || '') + (o.lead ? ' · ' + o.lead : '') + ' · ' + (o.status || '예정'), done: o.status === '완료', href: 'order.html?id=' + encodeURIComponent(o.id) }; });
    var b = DECO.events().filter(function (e) { return e.date === d; }).map(function (e) {
      return { k: DECO.KINDS.indexOf(e.kind) + 1, time: e.time || '', t: e.kind + (e.custId ? ' ' + cname(e.custId) : ''), s: e.title, done: !!e.done, ev: e }; });
    return a.concat(b).sort(function (x, y) { return (x.time || '99').localeCompare(y.time || '99'); });
  }
  function draw() {
    var y = view.getFullYear(), m = view.getMonth(), first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay()), td = DECO.today(), h = '';
    $('mt').textContent = y + '년 ' + (m + 1) + '월';
    h += '일월화수목금토'.split('').map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < 42; i++) { var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), ds = DECO.ymd(d);
      if (i >= 35 && d.getMonth() !== m) break;
      var its = items(ds);
      h += '<button type="button" class="day' + (d.getMonth() !== m ? ' out' : '') + (ds === td ? ' today' : '') + (ds === sel ? ' sel' : '') + (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '') + '" data-d="' + ds + '" aria-label="' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 일정 ' + its.length + '건">' +
        '<span class="n">' + d.getDate() + '</span>' + its.slice(0, 3).map(function (x) { return '<span class="ev k' + x.k + (x.done ? ' done' : '') + '">' + E((x.time ? x.time + ' ' : '') + x.t) + '</span>'; }).join('') +
        (its.length > 3 ? '<span style="font-size:12px;color:var(--muted)">+' + (its.length - 3) + '건</span>' : '') + '</button>';
    }
    $('cal').innerHTML = h; panel();
  }
  function panel() {
    var d = new Date(sel + 'T00:00'), its = items(sel);
    $('pt').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ') 일정 ' + its.length + '건';
    $('plist').innerHTML = its.length ? its.map(function (x, i) {
      return (x.href ? '<a class="it k' + x.k + '" href="' + x.href + '">' : '<button type="button" class="it k' + x.k + '" data-e="' + E(x.ev.id) + '">') +
        '<span>' + E((x.time ? x.time + ' · ' : '') + x.t) + (x.done ? ' (끝남)' : '') + '<small>' + E(x.s) + '</small></span><span>' + (x.href ? '지시서 열기 ›' : '고치기 ›') + '</span>' + (x.href ? '</a>' : '</button>');
    }).join('') : '<div class="empty">이 날 일정이 없습니다.</div>';
    $('mkOrder').href = 'order.html?date=' + sel;
    if (!editing) f.elements.date.value = sel;
  }
  function resetForm() { editing = null; f.reset(); f.elements.date.value = sel; if (P.get('cust')) $('cust').value = P.get('cust');
    $('ft').textContent = '일정 추가'; $('newE').hidden = $('delE').hidden = true; }
  $('cal').addEventListener('click', function (e) { var b = e.target.closest('.day'); if (!b) return; sel = b.dataset.d;
    var d = new Date(sel + 'T00:00'); if (d.getMonth() !== view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1);
    resetForm(); draw(); $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  $('plist').addEventListener('click', function (e) { var b = e.target.closest('[data-e]'); if (!b) return;
    editing = DECO.events().filter(function (x) { return x.id === b.dataset.e; })[0]; if (!editing) return;
    ['kind', 'time', 'date', 'custId', 'title'].forEach(function (k) { f.elements[k].value = editing[k] || ''; }); f.elements.done.value = editing.done ? '1' : '';
    $('ft').textContent = '일정 고치기'; $('newE').hidden = $('delE').hidden = false; f.elements.title.focus(); });
  f.addEventListener('submit', function (e) { e.preventDefault(); var o = editing || {};
    ['kind', 'time', 'date', 'custId', 'title'].forEach(function (k) { o[k] = f.elements[k].value.trim(); }); o.done = !!f.elements.done.value;
    var r = DECO.saveEvent(o); $('msg').className = 'msg' + (r ? '' : ' bad'); $('msg').textContent = r ? '저장했습니다.' : '저장하지 못했습니다.';
    if (r) { sel = r.date; view = new Date(sel + 'T00:00'); resetForm(); draw(); } });
  $('newE').addEventListener('click', resetForm);
  $('delE').addEventListener('click', function () { if (!editing || !confirm('이 일정을 지울까요?\n지운 일정은 되살릴 수 없습니다.')) return; DECO.delEvent(editing.id); resetForm(); draw(); $('msg').textContent = '지웠습니다.'; });
  $('prev').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); draw(); });
  $('next').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); draw(); });
  $('tod').addEventListener('click', function () { sel = DECO.today(); view = new Date(sel + 'T00:00'); resetForm(); draw(); });
  resetForm(); if (P.get('cust')) { $('kind').value = '실측 방문'; } draw();
})();
</script>
</body>
</html>
