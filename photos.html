<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>작업 사진 보관함 · 데코브라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<style>
.up{display:flex;flex-direction:column;gap:10px}
.up .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{font:inherit;font-size:16px;height:46px;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 10px;min-width:0;max-width:100%}
.up input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px}
.chips button{font:inherit;font-size:15px;height:40px;padding:0 14px;border:1px solid var(--bd);background:#fff;border-radius:10px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{background:#fff;border:1px solid var(--line);padding:0;cursor:pointer;text-align:left;font:inherit;display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#ddd}
.ph span{padding:5px 7px;font-size:13px;color:var(--ink2);line-height:1.35}
.ph b{display:inline-block;background:var(--pri-s);color:var(--pri);font-size:12px;padding:0 5px;margin-right:4px}
.grp{font-size:17px;margin:18px 0 8px;font-weight:700}
.view{position:fixed;inset:0;background:rgba(10,12,18,.92);display:flex;flex-direction:column;z-index:10;padding:12px}
.view img{flex:1;min-height:0;object-fit:contain;width:100%}
.view .vb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding-top:10px;color:#fff}
.view .vb input,.view .vb select{font:inherit;font-size:16px;height:44px;border-radius:10px;border:0;padding:0 10px}
.view .vb input{flex:1 1 220px}
.bar2{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:14px}
.baguide{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:8px 0;padding:12px 14px;border-radius:12px;background:#2a211d;color:#fff;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph.pick{outline:4px solid #E0952B;outline-offset:-4px}
</style>
</head>
<body class="app">
<div class="page">
  <div class="topnav"><button type="button" class="back" onclick="DECO.goBack()">← 뒤로</button><a class="home" href="index.html">처음 화면</a></div>
  <h1 class="t">작업 사진 보관함</h1>
  <p class="sub">현장별로 시공 전·중·후 사진을 모아 둡니다. 사진은 줄여서 서버 보관함에도 함께 저장되어 다른 기기에서도 보입니다.</p>
  <section class="card up">
    <div class="r">
      <label>① 현장 <select class="sel" id="job"></select></label>
      <label>② 구분 <select class="sel" id="stage"></select></label>
    </div>
    <div class="r">
      <label class="btn2 pri" for="cam">③ 사진 찍기</label><input id="cam" type="file" accept="image/*" capture="environment">
      <label class="btn2" for="files">사진 여러 장 고르기</label><a class="btn2" id="toSns" href="sns.html">이 현장 홍보 글 만들기 (인스타·블로그)</a><input id="files" type="file" accept="image/*" multiple>
      <button class="btn2" type="button" id="baBtn">시공 전·후 비교 사진 만들기</button>
    </div>
    <p class="msg" id="msg" role="status" style="margin:0"></p>
  </section>
  <div class="baguide" id="baGuide" hidden><b id="baTxt"></b> <button class="btn2" type="button" id="baCancel">그만두기</button></div>
  <div class="chips" id="chips" role="group" aria-label="구분으로 거르기"></div>
  <div class="bar2"><span id="cnt"></span><span id="space"></span></div>
  <div id="gal"></div>
</div>
<div class="view" id="view" hidden>
  <img id="vimg" alt="">
  <div class="vb">
    <select id="vstage" aria-label="구분"></select>
    <input id="vmemo" placeholder="메모 (예: 거실 우물 마감)" aria-label="메모">
    <button class="btn2 pri" type="button" id="vsave">메모 저장</button>
    <button class="btn2 pri" type="button" id="vshare" hidden>카톡·문자로 보내기</button>
    <button class="btn2" type="button" id="vexpo">🏠 e모델하우스 전시실로 보내기</button>
    <button class="btn2" type="button" id="vdown">내려받기</button>
    <button class="btn2 pri" type="button" id="vkeep" hidden>보관함에 저장</button>
    <button class="btn2 no" type="button" id="vdel">지우기</button>
    <button class="btn2" type="button" id="vclose">닫기</button>
  </div>
</div>
<script src="common.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, E = DECO.esc, msg = $('msg'), filt = '', all = [], urls = [], cur = null;
  var P = new URLSearchParams(location.search), Q = DECO.list();
  function jobName(id) { if (!id) return '현장 미지정'; var q = Q.filter(function (x) { return x.id === id; })[0]; return q ? ((q.cust && q.cust.name) || '이름 없음') + ' 님' + (q.cust && q.cust.addr ? ' · ' + q.cust.addr : '') : '지운 견적'; }
  $('job').innerHTML = '<option value="">현장 미지정</option>' + Q.map(function (q) { return '<option value="' + E(q.id) + '">' + E(jobName(q.id)) + '</option>'; }).join('') + '<option value="*">― 전체 현장 보기 ―</option>';
  $('job').value = P.get('job') || '*';
  $('stage').innerHTML = $('vstage').innerHTML = DECO.STAGES.map(function (s) { return '<option>' + s + '</option>'; }).join('');
  $('chips').innerHTML = ['전체'].concat(DECO.STAGES).map(function (s) { return '<button type="button" data-s="' + (s === '전체' ? '' : s) + '" aria-pressed="' + (s === '전체') + '">' + s + '</button>'; }).join('');
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; filt = b.dataset.s;
    $('chips').querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); draw(); });
  $('job').addEventListener('change', draw);
  function snsLink() { var j = $('job').value; $('toSns').href = 'sns.html' + (j && j !== '*' ? '?job=' + encodeURIComponent(j) : ''); }
  $('job').addEventListener('change', snsLink); snsLink();
  function say(t, bad) { msg.textContent = t; msg.className = 'msg' + (bad ? ' bad' : ''); }
  function load() { return DECO.photoAll().then(function (a) { all = a; draw(); }).catch(function () { say('이 브라우저에서는 사진을 저장할 수 없습니다.', true); }); }
  function draw() {
    urls.forEach(URL.revokeObjectURL); urls = [];
    var j = $('job').value, list = all.filter(function (p) { return (j === '*' || (p.job || '') === j) && (!filt || p.stage === filt); });
    $('cnt').textContent = '사진 ' + list.length + '장';
    if (!list.length) { $('gal').innerHTML = '<div class="empty">' + (all.length ? '이 조건의 사진이 없습니다.' : '아직 사진이 없습니다. 위에서 「사진 찍기」를 눌러 보세요.') + '</div>'; return; }
    var groups = {}; list.forEach(function (p) { var k = j === '*' ? (p.job || '') : p.stage; (groups[k] = groups[k] || []).push(p); });
    var order = j === '*' ? Object.keys(groups) : DECO.STAGES.filter(function (s) { return groups[s]; });
    $('gal').innerHTML = order.map(function (k) {
      return '<div class="grp">' + E(j === '*' ? jobName(k) : k) + ' (' + groups[k].length + ')</div><div class="gal">' + groups[k].map(function (p) {
        var u = URL.createObjectURL(p.blob); urls.push(u);
        return '<button type="button" class="ph" data-id="' + p.id + '"><img src="' + u + '" alt="' + E(p.stage) + ' 사진" loading="lazy"><span><b>' + E(p.stage) + '</b>' + DECO.date(p.taken || p.added) + (p.memo ? '<br>' + E(p.memo) : '') + '</span></button>';
      }).join('') + '</div>';
    }).join('');
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function (s) { $('space').textContent = '사용 ' + Math.round(s.usage / 1048576) + 'MB'; });
  }
  function addFiles(fl) {
    var files = Array.prototype.slice.call(fl || []); if (!files.length) return;
    var j = $('job').value === '*' ? '' : $('job').value, st = $('stage').value, n = 0;
    say('사진 ' + files.length + '장을 저장하는 중…');
    files.reduce(function (pr, f) { return pr.then(function () { return DECO.shrink(f).then(function (r) {
      return DECO.photoAdd({ job: j, stage: st, memo: '', blob: r.blob, w: r.w, h: r.h, taken: f.lastModified || Date.now() }); }).then(function () { n++; }, function () {}); }); }, Promise.resolve())
      .then(function () { say(n + '장을 「' + jobName(j) + ' · ' + st + '」에 저장했습니다.' + (n < files.length ? ' (' + (files.length - n) + '장은 열 수 없어 뺐습니다)' : ''), n < files.length); $('cam').value = $('files').value = ''; return load(); });
  }
  $('cam').addEventListener('change', function (e) { addFiles(e.target.files); });
  $('files').addEventListener('change', function (e) { addFiles(e.target.files); });
  // ── 시공 전·후 비교 사진
  var BA = null, baBlob = null;
  function baSay() { $('baGuide').hidden = !BA; if (BA) $('baTxt').textContent = BA.length ? '② 이제 「시공 후」 사진을 누르세요' : '① 먼저 「시공 전」 사진을 누르세요'; }
  $('baBtn').addEventListener('click', function () { BA = []; baSay(); $('gal').scrollIntoView({ behavior: 'smooth' }); });
  $('baCancel').addEventListener('click', function () { BA = null; baSay(); document.querySelectorAll('.ph.pick').forEach(function (x) { x.classList.remove('pick'); }); });
  function img(blob) { return new Promise(function (ok, no) { var u = URL.createObjectURL(blob), i = new Image(); i.onload = function () { ok(i); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); }; i.onerror = no; i.src = u; }); }
  function makeBA(a, b) { return Promise.all([img(a.blob), img(b.blob)]).then(function (I) {
    var port = I[0].height >= I[0].width, W = port ? 1600 : 1200, cw = port ? W / 2 : W, ch = port ? W / 2 * 4 / 3 : W * 9 / 16, foot = 90, H = port ? ch + foot : ch * 2 + foot;
    var c = document.createElement('canvas'); c.width = W; c.height = H; var x = c.getContext('2d'); x.fillStyle = '#1f1814'; x.fillRect(0, 0, W, H);
    I.forEach(function (im, k) { var dx = port ? k * cw : 0, dy = port ? 0 : k * ch, r = Math.max(cw / im.width, ch / im.height), sw = cw / r, sh = ch / r;
      x.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, dx, dy, cw, ch);
      x.fillStyle = k ? '#E0952B' : 'rgba(20,15,12,.82)'; x.fillRect(dx + 18, dy + 18, 230, 64); x.fillStyle = '#fff'; x.font = '800 34px "Noto Sans KR", sans-serif'; x.textBaseline = 'middle'; x.fillText(k ? '시공 후' : '시공 전', dx + 36, dy + 51);
      x.font = '700 18px "Noto Sans KR", sans-serif'; x.fillText(k ? 'AFTER' : 'BEFORE', dx + 160, dy + 52); });
    if (port) { x.fillStyle = '#fff'; x.fillRect(cw - 2, 0, 4, ch); } else { x.fillStyle = '#fff'; x.fillRect(0, ch - 2, W, 4); }
    var s = DECO.settings(); x.fillStyle = '#f3c98a'; x.font = '800 30px "Noto Sans KR", sans-serif'; x.textBaseline = 'middle'; x.fillText(s.company + ' · ' + (s.slogan || '간접조명 · 실링팬'), 28, H - foot / 2);
    x.fillStyle = '#fff'; x.font = '700 26px "Noto Sans KR", sans-serif'; x.textAlign = 'right'; x.fillText(s.phone || '', W - 28, H - foot / 2);
    return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', .9); }); }); }
  var vu = null;
  $('gal').addEventListener('click', function (e) { var b = e.target.closest('.ph'); if (!b) return;
    if (BA) { var p = all.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!p) return; b.classList.add('pick'); BA.push(p); baSay();
      if (BA.length === 2) { var pr = BA; BA = null; baSay(); say('비교 사진을 만드는 중…');
        makeBA(pr[0], pr[1]).then(function (bl) { document.querySelectorAll('.ph.pick').forEach(function (x) { x.classList.remove('pick'); }); baBlob = bl; cur = null;
          if (vu) URL.revokeObjectURL(vu); vu = URL.createObjectURL(bl); $('vimg').src = vu; $('view').hidden = false; $('vstage').hidden = $('vmemo').hidden = $('vsave').hidden = $('vdel').hidden = true; $('vkeep').hidden = false;
          say('비교 사진을 만들었습니다. 「내려받기」나 「보관함에 저장」을 누르세요.'); }, function () { say('비교 사진을 만들지 못했습니다.', true); }); }
      return; }
    cur = all.filter(function (p) { return p.id === b.dataset.id; })[0]; if (!cur) return; baBlob = null; $('vstage').hidden = $('vmemo').hidden = $('vsave').hidden = $('vdel').hidden = false; $('vkeep').hidden = true;
    if (vu) URL.revokeObjectURL(vu); vu = URL.createObjectURL(cur.blob); $('vimg').src = vu; $('vstage').value = cur.stage; $('vmemo').value = cur.memo || ''; $('view').hidden = false; });
  function close() { $('view').hidden = true; cur = null; }
  $('vclose').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('view').hidden) close(); });
  $('vsave').addEventListener('click', function () { cur.stage = $('vstage').value; cur.memo = $('vmemo').value.trim(); DECO.photoPut(cur).then(function () { close(); say('메모를 저장했습니다.'); load(); }); });
  function canShare() { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/jpeg' })], 'a.jpg', { type: 'image/jpeg' })] })); } catch (e) { return false; } }
  $('vshare').hidden = !canShare();
  $('vshare').addEventListener('click', function () { var b = baBlob || (cur && cur.blob); if (!b) return; var s = DECO.settings();
    var f = new File([b], (cur ? '현장사진_' + cur.stage.replace('·', '') : '시공전후') + '.jpg', { type: 'image/jpeg' });
    navigator.share({ files: [f], title: s.company + ' 시공 사진', text: s.company + ' ' + (s.phone || '') }).catch(function () {}); });
  $('vkeep').addEventListener('click', function () { if (!baBlob) return; var j = $('job').value === '*' ? '' : $('job').value;
    DECO.photoAdd({ job: j, stage: '시공 후', memo: '전·후 비교', blob: baBlob, taken: Date.now() }).then(function () { close(); say('비교 사진을 「' + jobName(j) + ' · 시공 후」에 저장했습니다.'); load(); }); });
  $('vdown').addEventListener('click', function () { var a = document.createElement('a'); a.href = vu; if (!cur) { a.download = '데코브라이트_시공전후_' + DECO.today().replace(/-/g, '') + '.jpg'; a.click(); return; } a.download = '데코브라이트_' + jobName(cur.job).split(' · ')[0] + '_' + cur.stage.replace('·', '') + '_' + DECO.date(cur.taken || cur.added).replace(/\D+/g, '') + '.jpg'; a.click(); });
  $('vdel').addEventListener('click', function () { if (!confirm('이 사진을 지울까요?\n지운 사진은 되살릴 수 없습니다.')) return; DECO.photoDel(cur.id).then(function () { close(); say('사진을 지웠습니다.'); load(); }); });
  // ── e모델하우스 전시실로 보내기 (서버 보관함 photos 의 e/ 폴더, 기록 coll 'emodel') ──
  var EXC = null;
  function exClient() { if (EXC) return Promise.resolve(EXC); return new Promise(function (ok, no) { function mk() { EXC = window.supabase.createClient('https://dypvqgaayumrhaiphatu.supabase.co', 'sb_publishable_5-LUZwZQ3VwBxDKDA_nJpw_ddF6QKdE', { auth: { persistSession: false } }); ok(EXC); }
    if (window.supabase && window.supabase.createClient) return mk(); var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js'; sc.onload = mk; sc.onerror = no; document.head.appendChild(sc); }); }
  var exSent = {};
  $('vexpo').addEventListener('click', function () { var b = baBlob || (cur && cur.blob); if (!b) return; var key = cur ? cur.id : 'ba';
    if (exSent[key]) { say('이미 전시실로 보낸 사진입니다.'); return; }
    var t = ($('vmemo').hidden ? '' : $('vmemo').value.trim()) || (cur ? (cur.memo || '시공 사진') : '시공 전·후 비교'), btn = this; btn.disabled = true; btn.textContent = '보내는 중…';
    exClient().then(function (c) { var id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), path = 'e/' + id + '.jpg';
      return c.storage.from('photos').upload(path, b, { upsert: true, contentType: 'image/jpeg' }).then(function (r) { if (r.error) throw r.error;
        return c.from('records').upsert({ coll: 'emodel', id: id, data: { title: t, path: path, at: new Date().toISOString(), from: cur ? cur.id : '' } }, { onConflict: 'coll,id' }); }).then(function (r) { if (r.error) throw r.error; }); })
      .then(function () { exSent[key] = 1; btn.textContent = '✔ 전시실로 보냈습니다'; say('e모델하우스 전시실 맨 뒤에 「' + t + '」(으)로 올렸습니다. 손님 화면에 바로 나옵니다.'); },
        function (e) { btn.disabled = false; btn.textContent = '🏠 e모델하우스 전시실로 보내기'; say('전시실로 보내지 못했습니다: ' + (e && e.message || e), true); }); });
  $('gal').addEventListener('click', function () { var b = $('vexpo'); b.disabled = false; b.textContent = '🏠 e모델하우스 전시실로 보내기'; }, true);
  // 처음 화면 「새 사진」 알림 끄기
  try { localStorage.setItem('deco-upseen', String(Date.now())); } catch (e) {}
  load();
})();
</script>
</body>
</html>
