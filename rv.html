<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시공 후기 남기기 · 데코브라이트</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="icon" href="icons/icon.svg">
<style>
:root{--ink:#221C18;--muted:#7A6E66;--line:#E6D9C6;--bd:#CDBBA3;--pri:#3B2F2A;--paper:#FBF6EE;--warm:#E0952B;--warm-s:#FCEBD2;--ok:#2E6A4E;--no:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:17px;line-height:1.55}
.w{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.hd{background:#1d1714;color:#fbf2e4;border-radius:14px;padding:16px;margin-bottom:12px}
.hd h1{margin:0 0 6px;font-size:23px}
.hd p{margin:2px 0;font-size:16px;color:#e9dccb}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.f{display:block;font-weight:700;margin-bottom:10px}
label.f input{display:block;width:100%;margin-top:4px;font:inherit;font-size:18px;height:52px;border:1px solid var(--bd);border-radius:10px;padding:0 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.seg button{flex:1 1 30%;font:inherit;font-size:17px;font-weight:700;height:50px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:64px;font:inherit;font-size:21px;font-weight:800;border-radius:14px;border:0;cursor:pointer;margin-bottom:10px}
.big.a{background:var(--warm);color:#1d1714}
.big.b{background:#fff;border:2px solid var(--pri);color:var(--pri)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.msg{min-height:26px;font-weight:700;margin:4px 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--no)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.ckI{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line);font-size:18px;cursor:pointer}
.st{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}
.st button{font-size:44px;line-height:1;background:none;border:0;cursor:pointer;color:#d8cfc6;padding:4px}
.st button.on{color:#E0952B}
textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:18px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.okl{display:flex;gap:10px;align-items:flex-start;font-size:17px;margin:10px 0}
.okl input{width:26px;height:26px;flex:none;margin-top:2px}
</style>
</head>
<body>
<div class="w">
  <div class="hd"><h1>⭐ 시공 후기 남기기</h1><p id="hInfo">불러오는 중…</p></div>
  <div id="main" hidden>
    <div class="card">
      <b style="font-size:19px">시공은 만족스러우셨나요?</b>
      <div class="st" id="st" role="radiogroup" aria-label="별점"></div>
      <label class="f">한마디 남겨 주세요 <small style="font-weight:400;color:var(--muted)">(선택)</small><textarea id="tx" rows="4" maxlength="300" placeholder="예: 거실이 호텔 같아졌어요. 실링팬 바람도 조용해요."></textarea></label>
      <label class="okl"><input type="checkbox" id="ok" checked> 홈페이지(e모델하우스)에 후기로 올려도 됩니다. <small style="color:var(--muted)">(성함은 가운데 글자를 가려서 보입니다)</small></label>
      <button type="button" class="big a" id="go">📨 후기 보내기</button>
      <p class="msg" id="msg" role="status"></p>
    </div>
  </div>
  <div class="card" id="done" hidden style="border:2px solid var(--ok);font-size:18px;font-weight:700"></div>
  <div class="err" id="bad" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, P = new URLSearchParams(location.search), oid = P.get('o') || '', key = P.get('k') || '', C = null, ord = null, star = 0;
  function bad(t) { $('main').hidden = true; $('bad').hidden = false; $('bad').textContent = t; $('hInfo').textContent = '데코브라이트'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function mask(n) { n = String(n || '').replace(/\s/g, ''); return n.length < 2 ? (n || '고객') : n.length === 2 ? n[0] + '*' : n[0] + '*'.repeat(n.length - 2) + n[n.length - 1]; }
  $('st').innerHTML = [1, 2, 3, 4, 5].map(function (i) { return '<button type="button" data-s="' + i + '" aria-label="별 ' + i + '개">★</button>'; }).join('');
  function sd() { [].forEach.call($('st').children, function (b) { b.classList.toggle('on', +b.dataset.s <= star); b.setAttribute('aria-pressed', String(+b.dataset.s === star)); }); }
  $('st').addEventListener('click', function (e) { var b = e.target.closest('[data-s]'); if (b) { star = +b.dataset.s; sd(); } });
  if (!window.supabase || !oid || !key) return bad(!window.supabase ? '인터넷 연결을 확인하고 다시 열어 주세요.' : '주소가 잘못되었습니다. 받으신 카톡의 주소를 다시 눌러 주세요.');
  C = window.supabase.createClient('https://dypvqgaayumrhaiphatu.supabase.co', 'sb_publishable_5-LUZwZQ3VwBxDKDA_nJpw_ddF6QKdE', { auth: { persistSession: false } });
  Promise.all([C.from('records').select('data').eq('coll', 'orders').eq('id', oid).maybeSingle(), C.from('records').select('data').eq('coll', 'rvq').eq('id', oid).maybeSingle()]).then(function (r) { var d = r[0].data && r[0].data.data, old = r[1].data && r[1].data.data;
    if (r[0].error) return bad('서버에 연결하지 못했습니다. 잠시 뒤 다시 열어 주세요.');
    if (!d || d._del || !d.upk || d.upk !== key) return bad('후기 주소가 맞지 않습니다. 담당자에게 문의해 주세요.');
    ord = d; $('hInfo').textContent = (d.name ? d.name + ' 님, ' : '') + '소중한 의견 감사합니다.';
    if (old && !old._del) { star = old.star || 0; $('tx').value = old.text || ''; $('ok').checked = !!old.ok; $('go').textContent = '📨 후기 고쳐 보내기'; } else star = 5; sd(); $('main').hidden = false; }, function () { bad('서버에 연결하지 못했습니다. 인터넷을 확인해 주세요.'); });
  $('go').onclick = function () { var m = $('msg'), btn = this; if (!star) { m.className = 'msg bad'; m.textContent = '별을 눌러 주세요.'; return; }
    btn.disabled = true; m.className = 'msg'; m.textContent = '보내는 중…';
    var R = { id: oid, oid: oid, star: star, text: $('tx').value.trim(), ok: $('ok').checked, nm: mask(ord.name), area: String(ord.addr || '').split(/\s+/).slice(0, 2).join(' '), at: Date.now() };
    C.from('records').upsert({ coll: 'rvq', id: oid, data: R }, { onConflict: 'coll,id' }).then(function (r) { if (r.error) throw r.error; C.functions.invoke('notify', { body: { coll: 'rvq', id: oid } }).catch(function () {}); $('main').hidden = true; $('done').hidden = false; $('done').textContent = '✔ 후기를 보냈습니다. 정말 감사합니다! 불편한 점이 생기면 언제든 연락 주세요.'; },
      function () { btn.disabled = false; m.className = 'msg bad'; m.textContent = '보내지 못했습니다. 인터넷을 확인하고 다시 눌러 주세요.'; }); };
})();
</script>
</body>
</html>
